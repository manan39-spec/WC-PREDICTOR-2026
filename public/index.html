function AdminView({ state, users, updateState, isAdmin, setIsAdmin, showToast, onRefresh }) {
  const [adminUser, setAdminUser] = useState("");
  const [pw, setPw] = useState("");

  const tryLogin = () => {
    if (adminUser.trim() === ADMIN_USERNAME && pw === ADMIN_PASSWORD) {
      setIsAdmin(true);
    } else {
      showToast("Wrong admin credentials");
    }
  };

  if (!isAdmin) {
    return (
      <div style={{ maxWidth: 480, margin: '40px auto' }}>
        <div className="card">
          <div className="card-title">Admin access</div>
          <p style={{ color: 'var(--ink-dim)', fontSize: 13, marginBottom: 16 }}>
            Only the person setting up the league should be admin. Credentials are set in the code by whoever deployed this — ask them if you need them.
          </p>
          <div className="field">
            <label>Admin username</label>
            <input type="text" value={adminUser} onChange={e=>setAdminUser(e.target.value)} placeholder="Admin username" autoFocus onKeyDown={e=>e.key==="Enter" && tryLogin()} />
          </div>
          <div className="field">
            <label>Password</label>
            <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter" && tryLogin()} />
          </div>
          <button className="btn btn-primary" onClick={tryLogin}>Unlock admin</button>
        </div>
      </div>
    );
  }

  return <AdminDashboard state={state} users={users} updateState={updateState} showToast={showToast} onRefresh={onRefresh} />;
}

function AdminDashboard({ state, users, updateState, showToast, onRefresh }) {
  const [section, setSection] = useState("phase");

  const setPhase = async (newPhase) => {
    await updateState(s => ({ ...s, phase: newPhase }));
    showToast(`Phase: ${PHASE_LABELS[newPhase]}`);
  };

  const toggleLock = async (round) => {
    await updateState(s => ({ ...s, locks: { ...s.locks, [round]: !s.locks[round] } }));
    showToast("Lock toggled");
  };

  return (
    <div>
      <div className="page-head">
        <div className="eyebrow">ADMIN · LEAGUE CONTROL</div>
        <h1 className="page-title">RUN THE <span className="it">tournament.</span></h1>
        <p className="page-sub">Set up groups, advance phases, lock predictions, enter results, manage bonus questions.</p>
        <div style={{ marginTop: 16, display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          <div className="phase-pill"><div className="dot"></div>Phase: {PHASE_LABELS[state.phase]}</div>
          <div className="phase-pill">{users.length} {users.length === 1 ? "player" : "players"}</div>
          <div className="phase-pill">{(state.bonus||[]).length} bonus Qs</div>
        </div>
      </div>

      <div className="nav" style={{ marginBottom: 28 }}>
        {[
          ["phase","Phase & Locks"],
          ["players","Players"],
          ["groups","Groups"],
          ["fixtures","Knockout Fixtures"],
          ["results","Enter Results"],
          ["bonus","Bonus Questions"],
          ["scoring","Scoring"],
          ["danger","Reset"]
        ].map(([k, l]) => (
          <button key={k} className={section===k?"active":""} onClick={() => setSection(k)}>{l}</button>
        ))}
      </div>

      {section === "phase" && (
        <div className="card">
          <div className="card-title">Phase Controller</div>
          <p className="helper" style={{ marginBottom: 18 }}>
            As the tournament progresses, advance the phase here. This controls what shows up in Predict for everyone. Lock toggles freeze predictions for that round.
          </p>
          <div className="grid grid-2">
            <div>
              <h4 style={{ fontFamily: 'JetBrains Mono', fontSize: 11, letterSpacing: '0.15em', color: 'var(--ink-mute)', marginBottom: 12 }}>CURRENT PHASE</h4>
              <select value={state.phase} onChange={e => setPhase(e.target.value)} style={{ width: '100%', padding: 12, background: 'var(--bg-2)', border: '1px solid var(--line)', color: 'var(--ink)', fontSize: 14 }}>
                {PHASES.map(p => <option key={p} value={p}>{PHASE_LABELS[p]}</option>)}
              </select>
            </div>
            <div>
              <h4 style={{ fontFamily: 'JetBrains Mono', fontSize: 11, letterSpacing: '0.15em', color: 'var(--ink-mute)', marginBottom: 12 }}>PREDICTION LOCKS</h4>
              {["group","r32","r16","qf","sf","final"].map(r => (
                <div key={r} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 0', borderBottom: '1px dashed var(--line)' }}>
                  <span>{PHASE_LABELS[r]}</span>
                  <button className={"btn btn-sm " + (state.locks[r] ? "btn-danger" : "btn-ghost")} onClick={() => toggleLock(r)}>
                    {state.locks[r] ? "🔒 Locked" : "🔓 Open"}
                  </button>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {section === "groups" && <GroupsAdmin state={state} updateState={updateState} showToast={showToast} />}
      {section === "players" && <PlayersAdmin users={users} showToast={showToast} onRefresh={onRefresh} />}
      {section === "fixtures" && <FixturesAdmin state={state} updateState={updateState} showToast={showToast} />}
      {section === "results" && <ResultsAdmin state={state} updateState={updateState} showToast={showToast} />}
      {section === "bonus" && <BonusAdmin state={state} updateState={updateState} showToast={showToast} />}
      {section === "scoring" && <ScoringAdmin state={state} updateState={updateState} showToast={showToast} />}
      {section === "danger" && <DangerAdmin onRefresh={onRefresh} showToast={showToast} />}
    </div>
  );
}

function PlayersAdmin({ users, showToast, onRefresh }) {
  const [resetting, setResetting] = useState(null);
  const [newPw, setNewPw] = useState("");
  const [revealed, setRevealed] = useState(null); // { name, pw } shown briefly after reset
  const [deleting, setDeleting] = useState(null);

  const sorted = [...users].sort((a,b) => (a.joined || 0) - (b.joined || 0));

  const doReset = async () => {
    if (!resetting) return;
    if (newPw.length < 4) { showToast("Password too short"); return; }
    const key = "wc26_pred:" + resetting;
    const u = await getShared(key);
    if (!u) { showToast("Player not found"); return; }
    const salt = makeSalt();
    const passwordHash = await hashPassword(newPw, salt);
    await setShared(key, { ...u, salt, passwordHash });
    setRevealed({ name: resetting, pw: newPw });
    setResetting(null);
    setNewPw("");
    await onRefresh();
  };

  const doDelete = async () => {
    if (!deleting) return;
    const key = "wc26_pred:" + deleting;
    await remoteDeleteKeys([key]);
    localStorage.removeItem(key);
    showToast(`Removed ${deleting}`);
    setDeleting(null);
    await onRefresh();
  };

  return (
    <div className="card">
      <div className="card-title">
        Players · {users.length}
        <span style={{ fontFamily: 'JetBrains Mono', fontSize: 10, color: 'var(--ink-mute)', letterSpacing: '0.15em' }}>RESET PASSWORDS · REMOVE PLAYERS</span>
      </div>

      {revealed && (
        <div className="lock-banner" style={{ background: 'rgba(47,194,106,0.1)', borderColor: 'rgba(47,194,106,0.35)', color: 'var(--green)', justifyContent: 'space-between' }}>
          <div>
            ✓ Password reset for <strong>{revealed.name}</strong> · Tell them: <code style={{ background: 'var(--bg)', padding: '2px 8px', color: 'var(--accent-2)', fontFamily: 'JetBrains Mono' }}>{revealed.pw}</code>
          </div>
          <button className="btn btn-sm btn-ghost" onClick={() => setRevealed(null)}>Dismiss</button>
        </div>
      )}

      {users.length === 0 ? (
        <div className="empty"><div className="empty-title">NO PLAYERS YET</div><p>Once friends sign up they'll appear here.</p></div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {sorted.map(u => {
            const isResetting = resetting === u.name;
            const isDeleting = deleting === u.name;
            const joinedDate = u.joined ? new Date(u.joined).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : '—';
            const groupPicks = Object.values(u.groupWinners || {}).filter(Boolean).length;
            const thirdPicks = (u.thirds || []).length;
            return (
              <div key={u.name} style={{ background: 'var(--bg-2)', padding: 14, border: '1px solid var(--line)' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
                  <div>
                    <div style={{ fontFamily: 'Anton', fontSize: 18, letterSpacing: '0.04em' }}>{u.name.toUpperCase()}</div>
                    <div style={{ fontFamily: 'JetBrains Mono', fontSize: 10, color: 'var(--ink-mute)', letterSpacing: '0.12em', marginTop: 4 }}>
                      JOINED {joinedDate.toUpperCase()} · {groupPicks}/12 GW · {thirdPicks}/8 THIRDS · {u.passwordHash ? "🔒 PROTECTED" : "⚠️ NO PASSWORD"}
                    </div>
                  </div>
                  {!isResetting && !isDeleting && (
                    <div style={{ display: 'flex', gap: 6 }}>
                      <button className="btn btn-ghost btn-sm" onClick={() => { setResetting(u.name); setNewPw(""); setDeleting(null); setRevealed(null); }}>Reset password</button>
                      <button className="btn btn-danger btn-sm" onClick={() => { setDeleting(u.name); setResetting(null); }}>Remove</button>
                    </div>
                  )}
                </div>

                {isResetting && (
                  <div style={{ marginTop: 12, paddingTop: 12, borderTop: '1px dashed var(--line)', display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                    <input
                      type="text"
                      placeholder="New password (min 4 chars)"
                      value={newPw}
                      onChange={e => setNewPw(e.target.value)}
                      onKeyDown={e => e.key === "Enter" && doReset()}
                      autoFocus
                      style={{ flex: 1, minWidth: 200, padding: 10, background: 'var(--card)', border: '1px solid var(--line)', color: 'var(--ink)', fontFamily: 'JetBrains Mono' }}
                    />
                    <button className="btn btn-primary btn-sm" onClick={doReset}>Set password</button>
                    <button className="btn btn-ghost btn-sm" onClick={() => { setResetting(null); setNewPw(""); }}>Cancel</button>
                  </div>
                )}

                {isDeleting && (
                  <div style={{ marginTop: 12, paddingTop: 12, borderTop: '1px dashed var(--line)', display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                    <div style={{ flex: 1, fontSize: 13, color: 'var(--ink-dim)' }}>
                      This removes <strong>{u.name}</strong> and all their predictions. Cannot be undone.
                    </div>
                    <button className="btn btn-danger btn-sm" onClick={doDelete}>Yes, remove</button>
                    <button className="btn btn-ghost btn-sm" onClick={() => setDeleting(null)}>Cancel</button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      <div className="helper" style={{ marginTop: 16 }}>
        Resetting shows the new password once so you can tell the friend (e.g., over WhatsApp). The actual password is never stored in plain text — only a SHA-256 hash.
      </div>
    </div>
  );
}

function GroupsAdmin({ state, updateState, showToast }) {
  const [local, setLocal] = useState(state.groups || defaultGroups());

  const update = (L, idx, val) => {
    setLocal(g => ({ ...g, [L]: g[L].map((t,i) => i===idx ? val : t) }));
  };
  const save = async () => {
    await updateState(s => ({ ...s, groups: local }));
    showToast("Groups saved");
  };

  return (
    <div className="card">
      <div className="card-title">
        Group Stage Draw
        <button className="btn btn-primary btn-sm" onClick={save}>Save Groups</button>
      </div>
      <p className="helper" style={{ marginBottom: 18 }}>
        Enter all 4 teams for each of the 12 groups (A–L) of the WC2026 draw. These appear in everyone's predictions.
      </p>
      <div className="grid grid-2">
        {GROUP_LETTERS.map(L => (
          <div className="group-edit" key={L}>
            <div className="group-edit-head"><strong>{L}</strong><span style={{ fontFamily: 'JetBrains Mono', fontSize: 10, color: 'var(--ink-mute)', letterSpacing: '0.1em' }}>GROUP {L}</span></div>
            <div className="group-edit-row">
              {[0,1,2,3].map(i => (
                <input
                  key={i}
                  type="text"
                  placeholder={`Team ${i+1}`}
                  value={local[L][i] || ""}
                  onChange={e => update(L, i, e.target.value)}
                />
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function FixturesAdmin({ state, updateState, showToast }) {
  const [round, setRound] = useState("r32");
  const fixtures = (state.fixtures[round] || []);

  const add = async () => {
    const newF = { id: `${round}_${Date.now()}_${Math.random().toString(36).slice(2,6)}`, team1: "", team2: "" };
    await updateState(s => ({ ...s, fixtures: { ...s.fixtures, [round]: [...(s.fixtures[round]||[]), newF] } }));
  };
  const update = async (id, key, val) => {
    await updateState(s => ({
      ...s,
      fixtures: { ...s.fixtures, [round]: s.fixtures[round].map(f => f.id === id ? { ...f, [key]: val } : f) }
    }));
  };
  const remove = async (id) => {
    await updateState(s => ({
      ...s,
      fixtures: { ...s.fixtures, [round]: s.fixtures[round].filter(f => f.id !== id) },
      results: { ...s.results, [round]: Object.fromEntries(Object.entries(s.results[round]||{}).filter(([k]) => k !== id)) }
    }));
  };

  return (
    <div className="card">
      <div className="card-title">
        Knockout Fixtures
        <select value={round} onChange={e => setRound(e.target.value)} style={{ padding: 8, background: 'var(--bg-2)', border: '1px solid var(--line)', color: 'var(--ink)', fontSize: 13 }}>
          {KO_ROUNDS.map(r => <option key={r} value={r}>{PHASE_LABELS[r]}</option>)}
        </select>
      </div>
      <p className="helper" style={{ marginBottom: 18 }}>
        Add fixtures after the previous round finishes. R32 = 16 matches, R16 = 8, QF = 4, SF = 2, Final = 1.
      </p>
      {fixtures.length === 0 ? (
        <div className="empty"><div className="empty-title">NO FIXTURES</div><p>Add fixtures below.</p></div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 16 }}>
          {fixtures.map((f, idx) => (
            <div key={f.id} style={{ display: 'grid', gridTemplateColumns: '50px 1fr 1fr auto', gap: 8, alignItems: 'center', background: 'var(--bg-2)', padding: 10 }}>
              <span style={{ fontFamily: 'Anton', letterSpacing: '0.05em', color: 'var(--ink-mute)' }}>M{f.num || idx+1}</span>
              <input type="text" placeholder="Team 1" value={f.team1} onChange={e => update(f.id, "team1", e.target.value)} style={{ padding: 8, background: 'var(--card)', border: '1px solid var(--line)', color: 'var(--ink)' }} />
              <input type="text" placeholder="Team 2" value={f.team2} onChange={e => update(f.id, "team2", e.target.value)} style={{ padding: 8, background: 'var(--card)', border: '1px solid var(--line)', color: 'var(--ink)' }} />
              <button className="btn btn-danger btn-sm" onClick={() => remove(f.id)}>Remove</button>
            </div>
          ))}
        </div>
      )}
      <button className="btn btn-primary btn-sm" onClick={add}>+ Add fixture</button>
    </div>
  );
}

function ResultsAdmin({ state, updateState, showToast }) {
  const [section, setSection] = useState("group");
  return (
    <div className="card">
      <div className="card-title">
        Enter Actual Results
        <select value={section} onChange={e => setSection(e.target.value)} style={{ padding: 8, background: 'var(--bg-2)', border: '1px solid var(--line)', color: 'var(--ink)', fontSize: 13 }}>
          <option value="group">Group Stage</option>
          <option value="r32">R32</option>
          <option value="r16">R16</option>
          <option value="qf">QF</option>
          <option value="sf">SF</option>
          <option value="final">Final</option>
        </select>
      </div>
      {section === "group" ? <GroupResults state={state} updateState={updateState} /> : <KOResults state={state} updateState={updateState} round={section} />}
    </div>
  );
}

function GroupResults({ state, updateState }) {
  const [winners, setWinners] = useState(state.results.groupWinners || {});
  const [thirds, setThirds] = useState((state.results.thirdsAdvancing || []).join(", "));
  const allTeams = getAllTeams(state);

  const save = async () => {
    const thirdsArr = thirds.split(",").map(s => s.trim()).filter(Boolean);
    await updateState(s => ({ ...s, results: { ...s.results, groupWinners: winners, thirdsAdvancing: thirdsArr } }));
  };

  return (
    <div>
      <p className="helper" style={{ marginBottom: 16 }}>Pick the actual winner of each group and list the 8 third-placed teams that advanced.</p>
      <div className="grid grid-3" style={{ marginBottom: 18 }}>
        {GROUP_LETTERS.map(L => (
          <div key={L} className="group-edit">
            <div className="group-edit-head"><strong>{L}</strong><span style={{ fontFamily: 'JetBrains Mono', fontSize: 10, color: 'var(--ink-mute)' }}>WINNER</span></div>
            <select
              value={winners[L] || ""}
              onChange={e => setWinners({ ...winners, [L]: e.target.value })}
              style={{ width: '100%', padding: 8, background: 'var(--card)', border: '1px solid var(--line)', color: 'var(--ink)', fontSize: 13 }}
            >
              <option value="">— pick —</option>
              {(state.groups[L]||[]).filter(t => t && t.trim()).map(t => <option key={t} value={t}>{t}</option>)}
            </select>
          </div>
        ))}
      </div>
      <div className="field">
        <label>8 best third-placed teams (comma separated)</label>
        <input type="text" value={thirds} onChange={e => setThirds(e.target.value)} placeholder="e.g. Croatia, Senegal, Mexico, …" />
        <div className="helper">All names should exactly match how they appear in the group draw above.</div>
      </div>
      <button className="btn btn-primary" onClick={save}>Save group results</button>
    </div>
  );
}

function KOResults({ state, updateState, round }) {
  const fixtures = state.fixtures[round] || [];
  const results = state.results[round] || {};
  const wantScore = round !== "r32";

  const setResult = async (mid, key, val) => {
    await updateState(s => ({
      ...s,
      results: { ...s.results, [round]: { ...(s.results[round]||{}), [mid]: { ...((s.results[round]||{})[mid]||{}), [key]: val } } }
    }));
  };

  if (fixtures.length === 0) {
    return <div className="empty"><div className="empty-title">NO FIXTURES</div><p>Add {PHASE_LABELS[round]} fixtures first.</p></div>;
  }

  return (
    <div>
      <p className="helper" style={{ marginBottom: 16 }}>Mark the actual winner{wantScore ? " and the exact final score" : ""} for each match.</p>
      <div className="grid grid-2">
        {fixtures.map((f, idx) => {
          const r = results[f.id] || {};
          return (
            <div key={f.id} className="match-card">
              <div className="match-num">{f.label || `M${f.num || idx+1}`} · {f.team1} vs {f.team2}</div>
              <div className="match-teams">
                {[f.team1, f.team2].map(t => (
                  <div key={t} className={"team-pick" + (r.winner === t ? " selected" : "")} onClick={() => setResult(f.id, "winner", t)}>{t}</div>
                ))}
              </div>
              {wantScore && (
                <div className="score-row">
                  <input type="number" min="0" placeholder="0" value={(r.score||"").split("-")[0] || ""} onChange={e => {
                    const v = e.target.value.replace(/[^0-9]/g, "");
                    const cur = (r.score || "").split("-");
                    setResult(f.id, "score", `${v}-${cur[1]||""}`);
                  }} />
                  <span className="score-dash">–</span>
                  <input type="number" min="0" placeholder="0" value={(r.score||"").split("-")[1] || ""} onChange={e => {
                    const v = e.target.value.replace(/[^0-9]/g, "");
                    const cur = (r.score || "").split("-");
                    setResult(f.id, "score", `${cur[0]||""}-${v}`);
                  }} />
                </div>
              )}
              <button className="btn btn-ghost btn-sm" style={{ marginTop: 10 }} onClick={() => setResult(f.id, "winner", "")}>Clear winner</button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function BonusAdmin({ state, updateState, showToast }) {
  const questions = state.bonus || [];
  const [draft, setDraft] = useState({ q: "", type: "text", options: "", answer: "", points: state.scoring.bonus });

  const add = async () => {
    if (!draft.q.trim()) { showToast("Question required"); return; }
    const q = {
      id: "b_" + Date.now() + "_" + Math.random().toString(36).slice(2,5),
      q: draft.q.trim(),
      type: draft.type,
      options: draft.type === "select" ? draft.options.split(",").map(s => s.trim()).filter(Boolean) : [],
      answer: draft.answer.trim(),
      points: parseInt(draft.points) || state.scoring.bonus,
      locked: false
    };
    await updateState(s => ({ ...s, bonus: [...(s.bonus||[]), q] }));
    setDraft({ q: "", type: "text", options: "", answer: "", points: state.scoring.bonus });
    showToast("Bonus question added");
  };

  const update = async (id, key, val) => {
    await updateState(s => ({
      ...s,
      bonus: s.bonus.map(q => q.id === id ? { ...q, [key]: val } : q)
    }));
  };
  const remove = async (id) => {
    await updateState(s => ({ ...s, bonus: s.bonus.filter(q => q.id !== id) }));
  };

  return (
    <div>
      <div className="card" style={{ marginBottom: 20 }}>
        <div className="card-title">Add Bonus Question</div>
        <div className="field">
          <label>Question</label>
          <input type="text" placeholder="e.g. Who wins the Golden Ball?" value={draft.q} onChange={e => setDraft({...draft, q: e.target.value})} />
        </div>
        <div className="grid grid-2">
          <div className="field">
            <label>Type</label>
            <select value={draft.type} onChange={e => setDraft({...draft, type: e.target.value})}>
              <option value="text">Text answer</option>
              <option value="select">Multiple choice</option>
            </select>
          </div>
          <div className="field">
            <label>Points</label>
            <input type="number" min="1" value={draft.points} onChange={e => setDraft({...draft, points: e.target.value})} />
          </div>
        </div>
        {draft.type === "select" && (
          <div className="field">
            <label>Options (comma separated)</label>
            <input type="text" placeholder="e.g. Messi, Mbappe, Bellingham, Vinicius" value={draft.options} onChange={e => setDraft({...draft, options: e.target.value})} />
          </div>
        )}
        <div className="field">
          <label>Correct answer (optional, can fill later)</label>
          <input type="text" value={draft.answer} onChange={e => setDraft({...draft, answer: e.target.value})} />
        </div>
        <button className="btn btn-primary" onClick={add}>+ Add question</button>
      </div>

      <div className="card">
        <div className="card-title">Existing Questions ({questions.length})</div>
        {questions.length === 0 ? <div className="empty"><div className="empty-title">NO QUESTIONS</div></div> : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            {questions.map(q => (
              <div key={q.id} style={{ background: 'var(--bg-2)', padding: 14, border: '1px solid var(--line)' }}>
                <div style={{ fontWeight: 600, marginBottom: 8 }}>{q.q}</div>
                <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 8, fontFamily: 'JetBrains Mono', fontSize: 11, color: 'var(--ink-mute)', letterSpacing: '0.1em' }}>
                  <span>{q.type.toUpperCase()}</span><span>·</span>
                  <span>{q.points} PTS</span><span>·</span>
                  <span>{q.locked ? "🔒 LOCKED" : "OPEN"}</span>
                  {q.options.length > 0 && <><span>·</span><span>{q.options.length} OPTIONS</span></>}
                </div>
                <div className="field" style={{ marginBottom: 8 }}>
                  <label>Correct answer</label>
                  <input type="text" value={q.answer || ""} onChange={e => update(q.id, "answer", e.target.value)} placeholder="Leave blank until decided" />
                </div>
                <div style={{ display: 'flex', gap: 8 }}>
                  <button className="btn btn-ghost btn-sm" onClick={() => update(q.id, "locked", !q.locked)}>
                    {q.locked ? "Unlock" : "Lock"}
                  </button>
                  <button className="btn btn-danger btn-sm" onClick={() => remove(q.id)}>Delete</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function ScoringAdmin({ state, updateState, showToast }) {
  const [s, setS] = useState(state.scoring || DEFAULT_SCORING);
  const save = async () => {
    await updateState(st => ({ ...st, scoring: { ...s, groupWinner: +s.groupWinner, thirdPlaced: +s.thirdPlaced, r32: +s.r32, r16: +s.r16, r16Score: +s.r16Score, qf: +s.qf, qfScore: +s.qfScore, sf: +s.sf, sfScore: +s.sfScore, final: +s.final, finalScore: +s.finalScore, bonus: +s.bonus } }));
    showToast("Scoring saved");
  };
  return (
    <div className="card">
      <div className="card-title">Scoring Configuration <button className="btn btn-primary btn-sm" onClick={save}>Save</button></div>
      <div className="grid grid-3">
        {[
          ["groupWinner","Group winner"],
          ["thirdPlaced","Third placed (each)"],
          ["r32","R32 winner"],
          ["r16","R16 winner"],
          ["r16Score","R16 exact score"],
          ["qf","QF winner"],
          ["qfScore","QF exact score"],
          ["sf","SF winner"],
          ["sfScore","SF exact score"],
          ["final","Final winner"],
          ["finalScore","Final exact score"],
          ["bonus","Bonus question (default)"]
        ].map(([k,l]) => (
          <div key={k} className="field">
            <label>{l}</label>
            <input type="number" value={s[k]} onChange={e => setS({...s, [k]: e.target.value})} />
          </div>
        ))}
      </div>
    </div>
  );
}

function DangerAdmin({ onRefresh, showToast }) {
  const [confirm, setConfirm] = useState(false);

  const wipeAll = async () => {
    await remoteWipePrefix("wc26_");
    const keys = await listShared("wc26_");
    for (const k of keys) {
      localStorage.removeItem(k);
    }
    Object.keys(localStorage).filter(k => k.startsWith("wc26_")).forEach(k => localStorage.removeItem(k));
    showToast("All data wiped");
    await onRefresh();
    setConfirm(false);
  };

  return (
    <div className="card">
      <div className="card-title" style={{ color: 'var(--red)' }}>Danger Zone</div>
      <p className="helper" style={{ marginBottom: 16 }}>
        Wipe ALL league data — every prediction, every result, the groups, everything. Cannot be undone.
      </p>
      {confirm ? (
        <div style={{ display: 'flex', gap: 8 }}>
          <button className="btn btn-danger" onClick={wipeAll}>Yes — wipe everything</button>
          <button className="btn btn-ghost" onClick={() => setConfirm(false)}>Cancel</button>
        </div>
      ) : (
        <button className="btn btn-danger" onClick={() => setConfirm(true)}>Reset entire league</button>
      )}
    </div>
  );
}

root.render(<App />);
</script>
