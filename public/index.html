<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PANENKA FIFA26 Edition - The Ultimate World Cup Prediction Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,700;9..144,900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e0a;
    --bg-2: #11140f;
    --card: #161a13;
    --card-2: #1d2118;
    --line: #2a2f24;
    --line-bright: #3a4030;
    --ink: #f1ecdc;
    --ink-dim: #b6b09a;
    --ink-mute: #6f6a58;
    --accent: #ff5e1f;
    --accent-2: #ffb84a;
    --green: #2fc26a;
    --red: #ff3b30;
    --blue: #4fb3ff;
    --yellow: #ffcc00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: 'Inter Tight', sans-serif; min-height: 100vh; }
  body {
    background-image:
      radial-gradient(1200px 600px at 90% -10%, rgba(255,94,31,0.08), transparent 60%),
      radial-gradient(800px 400px at -10% 110%, rgba(47,194,106,0.06), transparent 60%);
    background-attachment: fixed;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select { font-family: inherit; }
  a { color: var(--accent-2); }

  /* === LAYOUT === */
  .app { max-width: 1280px; margin: 0 auto; padding: 0 24px 80px; }
  .top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 0 18px; border-bottom: 1px solid var(--line); margin-bottom: 28px;
    position: sticky; top: 0; background: var(--bg); z-index: 10;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand-mark {
    font-family: 'Anton', sans-serif; letter-spacing: 0.02em;
    font-size: 28px; line-height: 1; color: var(--ink);
  }
  .brand-mark .accent { color: var(--accent); }
  .brand-sub {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.15em;
  }
  .user-pill {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px;
    font-size: 13px;
  }
  .user-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .user-pill button { font-size: 12px; color: var(--ink-mute); padding: 0 0 0 8px; border-left: 1px solid var(--line); }
  .user-pill button:hover { color: var(--accent); }

  /* === NAV === */
  .nav { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin-bottom: 32px; overflow-x: auto; }
  .nav button {
    font-family: 'Anton', sans-serif; font-size: 18px; letter-spacing: 0.04em;
    padding: 14px 22px 16px; color: var(--ink-mute);
    border-bottom: 3px solid transparent; transition: all 0.15s;
    white-space: nowrap;
  }
  .nav button:hover { color: var(--ink); }
  .nav button.active { color: var(--ink); border-bottom-color: var(--accent); }

  /* === HERO / HEADER === */
  .page-head { margin-bottom: 36px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--accent); letter-spacing: 0.2em; text-transform: uppercase;
    margin-bottom: 12px;
  }
  .page-title {
    font-family: 'Anton', sans-serif; font-size: clamp(40px, 7vw, 88px);
    line-height: 0.92; letter-spacing: -0.01em; text-transform: uppercase;
  }
  .page-title .it { font-family: 'Fraunces', serif; font-weight: 400; font-style: italic; font-size: 0.82em; letter-spacing: -0.02em; }
  .page-sub { color: var(--ink-dim); font-size: 16px; max-width: 720px; margin-top: 14px; line-height: 1.55; }

  /* === CARDS === */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 4px;
    padding: 24px;
  }
  .card-title {
    font-family: 'Anton', sans-serif; font-size: 22px; letter-spacing: 0.04em;
    text-transform: uppercase; margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .grid { display: grid; gap: 18px; }
  .grid-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .grid-3 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .grid-4 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

  /* === BUTTONS === */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 18px; border-radius: 3px; font-size: 13px;
    font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    transition: all 0.15s; border: 1px solid var(--line-bright);
    background: var(--card-2); color: var(--ink);
  }
  .btn:hover { border-color: var(--accent); }
  .btn-primary {
    background: var(--accent); color: #1a0f06; border-color: var(--accent);
  }
  .btn-primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  .btn-ghost { background: transparent; border-color: var(--line); }
  .btn-danger { background: transparent; border-color: rgba(255,59,48,0.4); color: var(--red); }
  .btn-danger:hover { background: rgba(255,59,48,0.1); }
  .btn-sm { padding: 7px 12px; font-size: 11px; }

  /* === FORMS === */
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--ink-mute); letter-spacing: 0.15em; text-transform: uppercase;
  }
  .field input, .field select {
    background: var(--bg-2); border: 1px solid var(--line); color: var(--ink);
    padding: 11px 14px; font-size: 14px; border-radius: 2px;
    outline: none; transition: border 0.15s;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field input:disabled, .field select:disabled { opacity: 0.6; cursor: not-allowed; }

  /* === LOGIN === */
  .login-wrap {
    min-height: 80vh; display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    max-width: 480px; width: 100%; padding: 48px 40px;
    border: 1px solid var(--line); background: var(--card);
    position: relative;
  }
  .login-card::before {
    content: ''; position: absolute; top: -1px; left: -1px; right: -1px; height: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
  }
  .login-title { font-family: 'Anton', sans-serif; font-size: 56px; line-height: 0.9; letter-spacing: 0; text-transform: uppercase; margin-bottom: 8px; }
  .login-title .it { font-family: 'Fraunces', serif; font-style: italic; font-weight: 400; color: var(--accent); }
  .login-sub { color: var(--ink-dim); margin-bottom: 32px; font-size: 14px; line-height: 1.5; }

  /* === HOME PAGE === */
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 32px; }
  .stat {
    background: var(--card); padding: 22px 20px;
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--ink-mute); letter-spacing: 0.18em; text-transform: uppercase;
    margin-bottom: 8px;
  }
  .stat-value {
    font-family: 'Anton', sans-serif; font-size: 44px; line-height: 1;
    letter-spacing: 0.02em;
  }
  .stat-value.accent { color: var(--accent); }
  .stat-value.green { color: var(--green); }
  .stat-sub { font-size: 12px; color: var(--ink-dim); margin-top: 6px; }

  /* === SCORING RULES === */
  .rules-list { list-style: none; }
  .rules-list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-bottom: 1px dashed var(--line); gap: 16px;
  }
  .rules-list li:last-child { border-bottom: none; }
  .rule-name { font-size: 14px; color: var(--ink); }
  .rule-points {
    font-family: 'Anton', sans-serif; font-size: 28px; color: var(--accent);
    letter-spacing: 0.04em;
  }
  .rule-points small { font-family: 'Inter Tight'; font-size: 10px; color: var(--ink-mute); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; margin-left: 4px; }

  /* === PREDICTIONS === */
  .group-card { padding: 18px; }
  .group-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .group-letter { font-family: 'Anton', sans-serif; font-size: 24px; letter-spacing: 0.04em; }
  .group-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-mute); letter-spacing: 0.15em; text-transform: uppercase; }
  .team-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; gap: 12px; font-size: 13px;
  }
  .team-radio {
    width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line-bright);
    flex-shrink: 0; position: relative; cursor: pointer;
  }
  .team-radio.checked { border-color: var(--accent); background: var(--accent); }
  .team-radio.checked::after {
    content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--bg);
  }
  .team-radio.correct { background: var(--green); border-color: var(--green); }
  .team-radio.wrong { background: var(--red); border-color: var(--red); }
  .team-name { flex: 1; }
  .team-row.faded { opacity: 0.4; }
  .team-row.locked { cursor: not-allowed; }

  /* === KNOCKOUT === */
  .match-card { background: var(--card); border: 1px solid var(--line); padding: 18px; }
  .match-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-mute); letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px; }
  .match-teams { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .team-pick {
    padding: 12px; border: 1px solid var(--line); border-radius: 2px;
    text-align: center; font-weight: 500; transition: all 0.15s; cursor: pointer;
    font-size: 14px;
  }
  .team-pick:hover { border-color: var(--ink-dim); }
  .team-pick.selected { border-color: var(--accent); background: rgba(255,94,31,0.08); color: var(--accent); }
  .team-pick.correct-pick { border-color: var(--green); background: rgba(47,194,106,0.1); color: var(--green); }
  .team-pick.wrong-pick { border-color: var(--red); background: rgba(255,59,48,0.08); color: var(--red); opacity: 0.7; }
  .team-pick.actual-winner { border-color: var(--green); }
  .score-row { display: flex; align-items: center; gap: 8px; justify-content: center; margin-top: 4px; }
  .score-row input { width: 56px; text-align: center; font-family: 'JetBrains Mono'; font-size: 18px; font-weight: 700; padding: 8px 4px; }
  .score-dash { color: var(--ink-mute); font-family: 'JetBrains Mono'; font-weight: 700; }
  .match-result-strip {
    margin-top: 10px; padding: 8px 12px; background: var(--bg-2);
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--ink-dim); letter-spacing: 0.05em;
    display: flex; justify-content: space-between;
  }
  .pts-badge { color: var(--accent); font-weight: 700; }

  /* === LEADERBOARD === */
  .lb-table { width: 100%; border-collapse: collapse; }
  .lb-table th, .lb-table td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--line); }
  .lb-table th {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--ink-mute); letter-spacing: 0.15em; text-transform: uppercase;
    font-weight: 500;
  }
  .lb-table td { font-size: 14px; }
  .lb-table tr:hover td { background: var(--card-2); }
  .lb-rank { font-family: 'Anton', sans-serif; font-size: 22px; letter-spacing: 0.04em; width: 60px; }
  .lb-rank.gold { color: var(--accent-2); }
  .lb-rank.silver { color: #cfd0d4; }
  .lb-rank.bronze { color: #d4824a; }
  .lb-total { font-family: 'Anton', sans-serif; font-size: 26px; color: var(--accent); letter-spacing: 0.02em; text-align: right; }
  .lb-breakdown { display: flex; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-mute); flex-wrap: wrap; }
  .lb-breakdown span { background: var(--bg-2); padding: 3px 8px; border: 1px solid var(--line); }
  .lb-breakdown span strong { color: var(--ink); font-weight: 700; margin-left: 4px; }

  /* === BONUS QUESTIONS === */
  .bonus-card { padding: 22px; margin-bottom: 16px; }
  .bonus-q {
    font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500;
    line-height: 1.3; margin-bottom: 16px;
  }
  .bonus-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  .bonus-opt {
    padding: 12px 14px; border: 1px solid var(--line); cursor: pointer;
    font-size: 13px; transition: all 0.15s; text-align: center;
    background: var(--bg-2);
  }
  .bonus-opt:hover { border-color: var(--ink-dim); }
  .bonus-opt.selected { border-color: var(--accent); background: rgba(255,94,31,0.08); color: var(--accent); }
  .bonus-opt.correct { border-color: var(--green); background: rgba(47,194,106,0.1); color: var(--green); }
  .bonus-opt.wrong { border-color: var(--red); opacity: 0.7; color: var(--red); }
  .bonus-text-in {
    width: 100%; padding: 12px 14px; background: var(--bg-2);
    border: 1px solid var(--line); color: var(--ink); font-size: 14px; outline: none;
  }
  .bonus-text-in:focus { border-color: var(--accent); }

  /* === ADMIN === */
  .admin-section { margin-bottom: 28px; }
  .admin-section h3 {
    font-family: 'Anton', sans-serif; font-size: 20px; letter-spacing: 0.04em;
    text-transform: uppercase; margin-bottom: 14px; color: var(--accent-2);
  }
  .group-edit { background: var(--bg-2); padding: 14px; margin-bottom: 8px; }
  .group-edit-head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .group-edit-head strong { font-family: 'Anton'; font-size: 18px; letter-spacing: 0.04em; min-width: 30px; }
  .group-edit-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; }
  .group-edit-row input { font-size: 13px; padding: 8px 10px; background: var(--card); border: 1px solid var(--line); color: var(--ink); outline: none; }
  .group-edit-row input:focus { border-color: var(--accent); }

  .phase-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; background: var(--bg-2); border: 1px solid var(--line);
    border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim);
  }
  .phase-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  /* === MISC === */
  .empty {
    padding: 60px 30px; text-align: center; color: var(--ink-mute);
    border: 1px dashed var(--line);
  }
  .empty-title { font-family: 'Anton', sans-serif; font-size: 28px; color: var(--ink-dim); margin-bottom: 8px; letter-spacing: 0.04em; }
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--card); border: 1px solid var(--accent);
    padding: 14px 20px; font-size: 13px; z-index: 100;
    animation: slideUp 0.2s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* === FOOTER === */
  .app-footer {
    margin-top: 60px;
    padding: 28px 0 12px;
    border-top: 1px solid var(--line);
    text-align: center;
    color: var(--ink-mute);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    line-height: 1.8;
  }
  .app-footer .accent { color: var(--accent); }
  .app-footer .copyright {
    margin-top: 6px;
    font-size: 9px;
    letter-spacing: 0.18em;
  }
  .login-footer {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    text-align: center;
    color: var(--ink-mute);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    line-height: 1.8;
  }
  .login-footer .accent { color: var(--accent); }

  .divider {
    height: 1px; background: var(--line); margin: 32px 0;
  }
  .helper {
    font-size: 12px; color: var(--ink-mute); margin-top: 6px; line-height: 1.5;
  }
  .lock-banner {
    background: rgba(255,94,31,0.08); border: 1px solid rgba(255,94,31,0.3);
    padding: 14px 18px; margin-bottom: 24px; font-size: 13px; color: var(--accent-2);
    display: flex; align-items: center; gap: 10px;
  }
  .checked-icon, .lock-icon { width: 16px; height: 16px; flex-shrink: 0; }

  /* === COUNTDOWN === */
  .countdown-row {
    background: linear-gradient(135deg, rgba(255,94,31,0.08), rgba(255,184,74,0.04));
    border: 1px solid rgba(255,94,31,0.25);
    padding: 28px 32px; margin-bottom: 32px;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    position: relative; overflow: hidden;
  }
  .countdown-row::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(600px 200px at 100% 0%, rgba(255,94,31,0.12), transparent 60%);
    pointer-events: none;
  }
  .countdown-label {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--accent); letter-spacing: 0.2em; text-transform: uppercase;
    margin-bottom: 4px;
  }
  .countdown-where {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--ink-mute); letter-spacing: 0.15em; text-transform: uppercase;
    margin-top: 6px;
  }
  .countdown-numbers { display: flex; align-items: flex-end; gap: 6px; position: relative; }
  .cd-unit { display: flex; flex-direction: column; align-items: center; min-width: 56px; }
  .cd-val {
    font-family: 'Anton', sans-serif; font-size: clamp(40px, 6vw, 64px);
    line-height: 0.9; color: var(--ink); letter-spacing: 0.02em;
  }
  .cd-label {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    color: var(--ink-mute); letter-spacing: 0.18em; margin-top: 4px;
  }
  .cd-sep {
    font-family: 'Anton', sans-serif; font-size: clamp(36px, 5vw, 56px);
    color: var(--accent); align-self: flex-start; line-height: 0.9; margin-top: 6px;
    animation: blink 1.2s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.25;} }
  .countdown-row.live { background: linear-gradient(135deg, rgba(47,194,106,0.10), rgba(47,194,106,0.02)); border-color: rgba(47,194,106,0.35); }
  .countdown-row.live .countdown-label { color: var(--green); }

  /* === PHASE TIMELINE === */
  .phase-timeline {
    display: flex; align-items: center; padding: 20px 8px; margin-bottom: 32px;
    background: var(--card); border: 1px solid var(--line); overflow-x: auto;
  }
  .phase-node { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 80px; flex-shrink: 0; }
  .phase-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--line-bright); background: var(--bg);
    position: relative; transition: all 0.2s;
  }
  .phase-node.done .phase-dot { background: var(--green); border-color: var(--green); }
  .phase-node.current .phase-dot {
    background: var(--accent); border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(255,94,31,0.2);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%,100%{ box-shadow: 0 0 0 4px rgba(255,94,31,0.2); }
    50%{ box-shadow: 0 0 0 8px rgba(255,94,31,0.05); }
  }
  .phase-name {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--ink-mute); letter-spacing: 0.12em; text-transform: uppercase;
    white-space: nowrap;
  }
  .phase-node.done .phase-name { color: var(--ink-dim); }
  .phase-node.current .phase-name { color: var(--accent); font-weight: 700; }
  .phase-line {
    height: 2px; flex: 1; min-width: 20px; background: var(--line-bright);
    margin: 0 -8px; margin-top: -22px;
  }
  .phase-line.done { background: var(--green); }

  /* === CTA CARD === */
  .cta-card {
    background: var(--card); border: 1px solid var(--accent);
    padding: 22px 28px; margin-bottom: 32px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    position: relative; overflow: hidden;
  }
  .cta-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--accent);
  }
  .cta-eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--accent); letter-spacing: 0.2em; text-transform: uppercase;
    margin-bottom: 4px;
  }
  .cta-title {
    font-family: 'Anton', sans-serif; font-size: 22px; letter-spacing: 0.03em;
    text-transform: uppercase; line-height: 1.1;
  }

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

// ============================================================
// SHARED JSON STORE (Vercel /api/store — all devices sync here)
// ============================================================
const API_STORE = '/api/store';
const SYNC_POLL_MS = 30000;
let apiReady = false;

async function initApi() {
  try {
    const res = await fetch(`${API_STORE}?health=1`);
    if (!res.ok) {
      apiReady = false;
      return false;
    }
    const data = await res.json();
    apiReady = !!data.ok;
    return apiReady;
  } catch (error) {
    console.warn('Shared store API unavailable:', error);
    apiReady = false;
    return false;
  }
}

async function remoteGet(key) {
  if (!apiReady) return null;
  try {
    const res = await fetch(`${API_STORE}?key=${encodeURIComponent(key)}`);
    if (!res.ok) return null;
    const data = await res.json();
    return data.value ?? null;
  } catch (error) {
    console.warn('remoteGet failed', error);
    return null;
  }
}

async function remoteSet(key, value) {
  if (!apiReady) return false;
  try {
    const res = await fetch(API_STORE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key, value })
    });
    return res.ok;
  } catch (error) {
    console.warn('remoteSet failed', error);
    return false;
  }
}

async function remoteList(prefix) {
  if (!apiReady) return [];
  try {
    const res = await fetch(`${API_STORE}?prefix=${encodeURIComponent(prefix)}`);
    if (!res.ok) return [];
    const data = await res.json();
    return Array.isArray(data.keys) ? data.keys : [];
  } catch (error) {
    console.warn('remoteList failed', error);
    return [];
  }
}

async function remoteDeleteKeys(keys) {
  if (!apiReady || !keys.length) return false;
  try {
    const res = await fetch(API_STORE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'delete', keys })
    });
    return res.ok;
  } catch (error) {
    console.warn('remoteDeleteKeys failed', error);
    return false;
  }
}

async function remoteWipePrefix(prefix) {
  if (!apiReady) return false;
  try {
    const res = await fetch(API_STORE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'wipe', prefix })
    });
    return res.ok;
  } catch (error) {
    console.warn('remoteWipePrefix failed', error);
    return false;
  }
}

function parseStored(value) {
  try { return value ? JSON.parse(value) : null; }
  catch { return null; }
}

// ============================================================

const ADMIN_USERNAME = "MADMIN";

const GROUP_LETTERS = ["A","B","C","D","E","F","G","H","I","J","K","L"]; // 12 groups for WC2026

function defaultState() {
  return {
    phase: "setup",
    templateVersion: BRACKET_VERSION,
    locks: { group: false, r32: false, r16: false, qf: false, sf: false, final: false },
    groups: defaultGroups(),
    results: {
      groupWinners: {}, // { A: "Spain", B: "..." }
      thirdsAdvancing: [], // ["Team1", ... up to 8]
      r32: {}, // { matchId: { winner: "X", score: "2-1" } }
      r16: {},
      qf: {},
      sf: {},
      final: {}

// ============================================================
// STORAGE HELPERS
// ============================================================

async function getShared(key) {
  if (apiReady) {
    const remoteValue = await remoteGet(key);
    if (remoteValue !== null) {
      try { localStorage.setItem(key, JSON.stringify(remoteValue)); } catch {}
      return remoteValue;
    }
  }
  try {
    return parseStored(localStorage.getItem(key));
  } catch {
    return null;
  }
}

async function setShared(key, value) {
  let savedLocal = false;
  try {
    localStorage.setItem(key, JSON.stringify(value));
    savedLocal = true;
  } catch (e) {
    console.error("setShared local", e);
  }
  if (apiReady) {
    await remoteSet(key, value);
  }
  return savedLocal;
}

async function getPersonal(key) {
  try {
    return parseStored(localStorage.getItem(key));
  } catch {
    return null;
  }
}

async function setPersonal(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    console.error("setPersonal", e);
    return false;
  }
}

async function listShared(prefix) {
  if (apiReady) {
    const remoteKeys = await remoteList(prefix);
    if (remoteKeys.length) return remoteKeys;
  }
  try {
    return Object.keys(localStorage).filter(k => k.startsWith(prefix));
  } catch {
    return [];
  }
}

// ============================================================
// PASSWORD HASHING — SHA-256 + per-user salt
// Not banking-grade; appropriate for a friend-group prediction app.
// ============================================================
async function hashPassword(password, salt) {
  const enc = new TextEncoder();
  const data = enc.encode(password + "::" + salt);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function makeSalt() {
  return Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2) + Date.now().toString(36);
}
async function makeUserRecord(name, password) {
  const salt = makeSalt();
  const passwordHash = await hashPassword(password, salt);
  return {
    name,
    joined: Date.now(),
    salt,
    passwordHash,
    groupWinners: {},
    thirds: [],
    r32: {}, r16: {}, qf: {}, sf: {}, final: {},
    bonus: {}
  };
}

// ============================================================
// SCORING ENGINE
// ============================================================
function calculateScore(predictions, state) {
  if (!predictions || !state) return { total: 0, breakdown: {} };
  const s = state.scoring || DEFAULT_SCORING;
  const r = state.results || {};
  const b = { group: 0, r32: 0, r16: 0, qf: 0, sf: 0, final: 0, bonus: 0 };

  // Group winners
  const gw = predictions.groupWinners || {};
  Object.entries(gw).forEach(([L, pick]) => {
    if (pick && r.groupWinners && r.groupWinners[L] && r.groupWinners[L] === pick) {
      b.group += s.groupWinner;
    }
  });

  // Thirds
  const thirds = predictions.thirds || [];
  const actualThirds = r.thirdsAdvancing || [];
  thirds.forEach(pick => {
    if (pick && actualThirds.includes(pick)) {
      b.group += s.thirdPlaced;
    }
  });

  // Knockouts
  KO_ROUNDS.forEach(round => {
    const userPicks = predictions[round] || {};
    const actuals = r[round] || {};
    Object.entries(userPicks).forEach(([mid, p]) => {
      const a = actuals[mid];
      if (!a) return;
      if (p.winner && a.winner && p.winner === a.winner) {
        b[round] += s[round];
      }
      if (round !== "r32") {
        const scoreKey = round + "Score";
        if (p.score && a.score && p.score === a.score) {
          b[round] += s[scoreKey];
        }
      }
    });
  });

  // Bonus
  const bp = predictions.bonus || {};
  (state.bonus || []).forEach(q => {
    if (!q.answer) return;
    const userAns = bp[q.id];
    if (userAns && String(userAns).trim().toLowerCase() === String(q.answer).trim().toLowerCase()) {
      b.bonus += (q.points || s.bonus);
    }
  });

  const total = Object.values(b).reduce((a,c) => a+c, 0);
  return { total, breakdown: b };
}

function getAllTeams(state) {
  const all = [];
  Object.values(state.groups || {}).forEach(arr => {
    arr.forEach(t => { if (t && t.trim()) all.push(t.trim()); });
  });
  return all;
}

// ============================================================
// MAIN APP
// ============================================================
function App() {
  const [loading, setLoading] = useState(true);
  const [user, setUser] = useState(null);
  const [state, setState] = useState(null);
  const [users, setUsers] = useState([]); // [{ name, predictions }]
  const [view, setView] = useState("home");
  const [toast, setToast] = useState(null);
  const [isAdmin, setIsAdmin] = useState(false);
  const [remoteAvailable, setRemoteAvailable] = useState(false);

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2400);
  }, []);

  const refreshAll = useCallback(async () => {
    let s = await getShared("wc26_state");
    if (!s) {
      s = defaultState();
      await setShared("wc26_state", s);
    } else {
      let needsSave = false;
      // Migration: regenerate fixtures + groups if template version is outdated or fixtures empty
      const needsBracket = !s.fixtures ||
        s.templateVersion !== BRACKET_VERSION ||
        (!s.fixtures.r32?.length && !s.fixtures.r16?.length &&
         !s.fixtures.qf?.length && !s.fixtures.sf?.length && !s.fixtures.final?.length);
      if (needsBracket) {
        s.fixtures = bracketTemplate();
        s.groups = defaultGroups();
        s.templateVersion = BRACKET_VERSION;
        // Clear all predictions across users — previous fixture/group IDs no longer valid
        const userKeys = await listShared("wc26_pred:");
        for (const k of userKeys) {
          const u = await getShared(k);
          if (u) {
            u.groupWinners = {};
            u.thirds = [];
            u.r32 = {}; u.r16 = {}; u.qf = {}; u.sf = {}; u.final = {};
            await setShared(k, u);
          }
        }
        // Also clear all results since teams/match IDs changed
        s.results = {
          groupWinners: {},
          thirdsAdvancing: [],
          r32: {}, r16: {}, qf: {}, sf: {}, final: {}
        };
        needsSave = true;
      }
      if (needsSave) await setShared("wc26_state", s);
    }
    setState(s);
    // Load all users' predictions
    const keys = await listShared("wc26_pred:");
    const all = [];
    for (const k of keys) {
      const data = await getShared(k);
      if (data) all.push(data);
    }
    setUsers(all);
  }, []);

  useEffect(() => {
    (async () => {
      const savedUser = await getPersonal("current_user");
      if (savedUser) setUser(savedUser);
      const remoteReady = await initApi();
      setRemoteAvailable(remoteReady);
      await refreshAll();
      setLoading(false);
    })();
  }, [refreshAll]);

  useEffect(() => {
    if (!remoteAvailable) return;
    const id = setInterval(() => refreshAll(), SYNC_POLL_MS);
    return () => clearInterval(id);
  }, [remoteAvailable, refreshAll]);

  const login = useCallback(async (name) => {
    const cleanName = name.trim();
    if (!cleanName) return;
    setUser(cleanName);
    await setPersonal("current_user", cleanName);
    await refreshAll();
  }, [refreshAll]);

  const logout = useCallback(async () => {
    setUser(null);
    setIsAdmin(false);
    await setPersonal("current_user", "");
  }, []);

  const myPredictions = useMemo(() => {
    if (!user || !users) return null;
    return users.find(u => u.name === user);
  }, [user, users]);

  const updateMyPredictions = useCallback(async (mutator) => {
    if (!user) return;
    let p = await getShared("wc26_pred:" + user);
    if (!p) p = { name: user, joined: Date.now(), groupWinners: {}, thirds: [], r32:{},r16:{},qf:{},sf:{},final:{}, bonus: {} };
    const updated = mutator({ ...p });
    await setShared("wc26_pred:" + user, updated);
    setUsers(prev => {
      const exists = prev.some(u => u.name === user);
      if (exists) return prev.map(u => u.name === user ? updated : u);
      return [...prev, updated];
    });
  }, [user]);

  const updateState = useCallback(async (mutator) => {
    const s = await getShared("wc26_state") || defaultState();
    const updated = mutator({ ...s });
    await setShared("wc26_state", updated);
    setState(updated);
  }, []);

  if (loading) {
    return (
      <div className="login-wrap">
        <div style={{ fontFamily: 'Anton', fontSize: 32, letterSpacing: '0.04em', color: 'var(--ink-mute)' }}>
          LOADING…
        </div>
      </div>
    );
  }

  if (!user) {
    return <LoginView onLogin={login} remoteAvailable={remoteAvailable} />;
  }

  return (
    <>
      <div className="app">
        <header className="top">
          <div className="brand">
            <div className="brand-mark">PANEN<span className="accent">KA</span></div>
            <div className="brand-sub">FIFA 26 · The Predictor Club · Road to Glory</div>
          </div>
          <div className="user-pill">
            <span className="dot"></span>
            <span>{user}</span>
            <button onClick={logout}>switch</button>
          </div>
        </header>

        <nav className="nav">
          <button className={view==="home"?"active":""} onClick={()=>setView("home")}>Home</button>
          <button className={view==="predict"?"active":""} onClick={()=>setView("predict")}>Predict</button>
          <button className={view==="bonus"?"active":""} onClick={()=>setView("bonus")}>Bonus</button>
          <button className={view==="leaderboard"?"active":""} onClick={()=>setView("leaderboard")}>Leaderboard</button>
          <button className={view==="admin"?"active":""} onClick={()=>setView("admin")}>Admin</button>
        </nav>

        {view==="home" && <HomeView state={state} user={user} myPred={myPredictions} users={users} onRefresh={refreshAll} setView={setView} />}
        {view==="predict" && <PredictView state={state} myPred={myPredictions} updateMyPredictions={updateMyPredictions} showToast={showToast} />}
        {view==="bonus" && <BonusView state={state} myPred={myPredictions} updateMyPredictions={updateMyPredictions} showToast={showToast} />}
        {view==="leaderboard" && <LeaderboardView state={state} users={users} currentUser={user} />}
        {view==="admin" && <AdminView state={state} users={users} updateState={updateState} isAdmin={isAdmin} setIsAdmin={setIsAdmin} showToast={showToast} onRefresh={refreshAll} />}

        <footer className="app-footer">
          Developed for <span className="accent">FIFA26</span>
          <div className="copyright">© {new Date().getFullYear()} PANENKA™ · All Rights Reserved</div>
        </footer>
      </div>
      {toast && <div className="toast">{toast}</div>}
    </>
  );
}

// LOGIN
// ============================================================
function LoginView({ onLogin, remoteAvailable }) {
  const [step, setStep] = useState("name"); // name | signin | claim | signup
  const [name, setName] = useState("");
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [roster, setRoster] = useState(null);

  useEffect(() => {
    fetch('/data/users.json')
      .then(r => r.ok ? r.json() : null)
      .then(data => data?.players?.length && setRoster(data.players.map(p => p.displayName)))
      .catch(() => {});
  }, []);

  const cleanName = name.trim();

  const checkName = async () => {
    if (!cleanName) { setError("Enter a name first"); return; }
    if (cleanName.length > 30) { setError("Keep it under 30 characters"); return; }
    setBusy(true); setError("");
    const existing = await getShared("wc26_pred:" + cleanName);
    setBusy(false);
    if (!existing) {
      setStep("signup");
    } else if (!existing.passwordHash) {
      setStep("claim"); // legacy record without password
    } else {
      setStep("signin");
    }
  };

  const doSignin = async () => {
    setBusy(true); setError("");
    const existing = await getShared("wc26_pred:" + cleanName);
    if (!existing) { setError("Account vanished — refresh and try again"); setBusy(false); return; }
    const hash = await hashPassword(pw, existing.salt);
    setBusy(false);
    if (hash !== existing.passwordHash) {
      setError("Wrong password. Ask the admin to reset if you forgot.");
      return;
    }
    onLogin(cleanName);
  };

  const doSignupOrClaim = async () => {
    if (pw.length < 4) { setError("Password should be at least 4 characters"); return; }
    if (pw !== pw2) { setError("Passwords don't match"); return; }
    setBusy(true); setError("");
    if (step === "signup") {
      const newUser = await makeUserRecord(cleanName, pw);
      await setShared("wc26_pred:" + cleanName, newUser);
    } else {
      // claim existing legacy record
      const existing = await getShared("wc26_pred:" + cleanName);
      if (!existing) { setError("Account vanished — refresh"); setBusy(false); return; }
      const salt = makeSalt();
      const passwordHash = await hashPassword(pw, salt);
      await setShared("wc26_pred:" + cleanName, { ...existing, salt, passwordHash });
    }
    setBusy(false);
    onLogin(cleanName);
  };

  const goBack = () => {
    setStep("name"); setPw(""); setPw2(""); setError("");
  };

  return (
    <div className="app">
      <div className="login-wrap">
        <div className="login-card">
          <div className="eyebrow">FIFA WORLD CUP · USA · CANADA · MEXICO · 2026</div>
          <div className="login-title">PANEN<span className="it">ka.</span></div>
          <p className="login-sub">
            {step === "name" && <>Named after Antonín Panenka's iconic 1976 penalty — the ultimate flex under pressure. Back your football instincts, outsmart your friends, and enjoy four years of bragging rights.<br/><br/>Make your picks. Beat your friends. Own the bragging rights.</>}
            {step === "signin" && <>Welcome back, <strong style={{ color: 'var(--accent)' }}>{cleanName}</strong>. Enter your password to access your predictions.</>}
            {step === "claim" && <>Looks like <strong style={{ color: 'var(--accent)' }}>{cleanName}</strong> exists from before passwords were required. Set one now to protect your picks.</>}
            {step === "signup" && <>New player. Welcome to PANENKA. Pick a password — you'll need it every time you sign in, and the admin can reset it if you forget.</>}
          </p>
          {!remoteAvailable && (
            <div className="lock-banner" style={{ borderColor: 'rgba(255,59,48,0.3)', color: 'var(--red)', marginBottom: 16 }}>
              ⚠️ Shared storage is offline. Predictions only save on this device until /api/store works with Upstash Redis linked in Vercel (see DEPLOYMENT_GUIDE.md).
            </div>
          )}

          {step === "name" && (
            <div className="helper" style={{ marginBottom: 14, lineHeight: 1.5 }}>
              First time? Pick any username and create a password — that's your account for the league. Logging back in? Use the same username and password you signed up with so your predictions stay tied to you across devices.
            </div>
          )}

          {step === "name" && (
            <>
              <div className="field">
                <label>Your name</label>
                <input
                  type="text"
                  placeholder="e.g. Karan, Manan, Aman, Riya…"
                  value={name}
                  onChange={e=>setName(e.target.value)}
                  onKeyDown={e=>e.key==="Enter" && checkName()}
                  autoFocus
                  disabled={busy}
                />
                <div className="helper">Use the same name every time. It's how your predictions stay attached to you.</div>
              </div>
              {error && <div style={{ color: 'var(--red)', fontSize: 13, marginBottom: 12 }}>{error}</div>}
              <button className="btn btn-primary" onClick={checkName} disabled={busy} style={{ width: '100%', justifyContent: 'center', padding: '14px' }}>
                {busy ? "Checking…" : "Continue →"}
              </button>
            </>
          )}

          {step === "signin" && (
            <>
              <div className="field">
                <label>Password</label>
                <input
                  type="password"
                  placeholder="Your password"
                  value={pw}
                  onChange={e=>setPw(e.target.value)}
                  onKeyDown={e=>e.key==="Enter" && doSignin()}
                  autoFocus
                  disabled={busy}
                />
              </div>
              {error && <div style={{ color: 'var(--red)', fontSize: 13, marginBottom: 12 }}>{error}</div>}
              <div style={{ display: 'flex', gap: 8 }}>
                <button className="btn btn-ghost" onClick={goBack} disabled={busy}>← Back</button>
                <button className="btn btn-primary" onClick={doSignin} disabled={busy} style={{ flex: 1, justifyContent: 'center' }}>
                  {busy ? "Verifying…" : "Sign in →"}
                </button>
              </div>
            </>
          )}

          {(step === "claim" || step === "signup") && (
            <>
              <div className="field">
                <label>{step === "claim" ? "Set a password" : "Create a password"}</label>
                <input
                  type="password"
                  placeholder="Min 4 characters"
                  value={pw}
                  onChange={e=>setPw(e.target.value)}
                  autoFocus
                  disabled={busy}
                />
              </div>
              <div className="field">
                <label>Confirm password</label>
                <input
                  type="password"
                  placeholder="Type it again"
                  value={pw2}
                  onChange={e=>setPw2(e.target.value)}
                  onKeyDown={e=>e.key==="Enter" && doSignupOrClaim()}
                  disabled={busy}
                />
                <div className="helper">Write it down somewhere. Admin can reset if you forget, but it's easier not to.</div>
              </div>
              {error && <div style={{ color: 'var(--red)', fontSize: 13, marginBottom: 12 }}>{error}</div>}
              <div style={{ display: 'flex', gap: 8 }}>
                <button className="btn btn-ghost" onClick={goBack} disabled={busy}>← Back</button>
                <button className="btn btn-primary" onClick={doSignupOrClaim} disabled={busy} style={{ flex: 1, justifyContent: 'center' }}>
                  {busy ? "Setting up…" : step === "signup" ? "Join the league →" : "Save & sign in →"}
                </button>
              </div>
            </>
          )}

          <div className="login-footer">
            Developed for <span className="accent">FIFA26</span>
            <div>© {new Date().getFullYear()} PANENKA™ · All Rights Reserved</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function HomeView({ state, user, myPred, users, onRefresh, setView }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, []);

  const score = useMemo(() => myPred ? calculateScore(myPred, state) : { total: 0, breakdown: {} }, [myPred, state]);
  const allScores = useMemo(() => {
    return users.map(u => ({ name: u.name, ...calculateScore(u, state) }))
                .sort((a,b) => b.total - a.total);
  }, [users, state]);
  const myRank = allScores.findIndex(s => s.name === user) + 1;
  const leader = allScores[0];
  const totalUsers = allScores.length;

  // ---- Countdown to opening match (Mexico City, 11 June 2026, ~18:00 local) ----
  const KICKOFF = new Date('2026-06-11T23:00:00Z').getTime();
  const diff = Math.max(0, KICKOFF - now);
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const minutes = Math.floor((diff % 3600000) / 60000);
  const seconds = Math.floor((diff % 60000) / 1000);
  const kickoffPassed = diff === 0;
  const pad = n => String(n).padStart(2, '0');

  // ---- Phase progress timeline ----
  const phaseOrder = ["setup","group","r32","r16","qf","sf","final","done"];
  const currentPhaseIdx = phaseOrder.indexOf(state.phase);

  // ---- Submission status (group stage completeness) ----
  const myGroupWinnersCount = Object.values(myPred?.groupWinners || {}).filter(Boolean).length;
  const myThirdsCount = (myPred?.thirds || []).length;
  const myGroupPicksDone = myGroupWinnersCount === 12 && myThirdsCount === 8;
  const friendsLocked = users.filter(u => {
    const w = Object.values(u.groupWinners || {}).filter(Boolean).length;
    return w === 12 && (u.thirds || []).length === 8;
  }).length;

  // ---- Phase-aware hero ----
  const heroByPhase = {
    setup:  { eyebrow: "AWAITING KICKOFF", l1: "PRE",      l2: "season."   },
    group:  { eyebrow: "PHASE 1 · LIVE",   l1: "PICK YOUR", l2: "winners." },
    r32:    { eyebrow: "PHASE 2 · LAST 32",l1: "ROUND",     l2: "of 32."   },
    r16:    { eyebrow: "PHASE 3 · LAST 16",l1: "ROUND",     l2: "of 16."   },
    qf:     { eyebrow: "PHASE 4 · QUARTERS",l1: "QUARTER",  l2: "finals."  },
    sf:     { eyebrow: "PHASE 5 · SEMIS",  l1: "SEMI",      l2: "finals."  },
    final:  { eyebrow: "PHASE 6 · FINAL",  l1: "THE",       l2: "final."   },
    done:   { eyebrow: "TOURNAMENT OVER",  l1: "GLORY",     l2: "decided." }
  };
  const hero = heroByPhase[state.phase] || heroByPhase.group;

  // ---- CTA logic ----
  let cta = null;
  if (state.phase === "setup") {
    cta = { eyebrow: "GET READY", title: "Tournament hasn't kicked off", sub: "Admin is finalising the group draw. Predictions open soon.", action: null };
  } else if (state.phase === "group" && !state.locks.group && !myGroupPicksDone) {
    cta = {
      eyebrow: "UNFINISHED BUSINESS",
      title: "Your group stage picks aren't done",
      sub: `${myGroupWinnersCount}/12 winners locked · ${myThirdsCount}/8 thirds picked`,
      action: { label: "Finish picks →", to: "predict" }
    };
  } else if (state.phase !== "setup" && state.phase !== "done" && state.phase !== "group" && !state.locks[state.phase]) {
    const myRoundPicks = Object.keys(myPred?.[state.phase] || {}).length;
    const totalFixtures = (state.fixtures[state.phase] || []).length;
    if (myRoundPicks < totalFixtures) {
      cta = {
        eyebrow: PHASE_LABELS[state.phase].toUpperCase() + " · OPEN",
        title: "Lock in your knockout picks",
        sub: `${myRoundPicks}/${totalFixtures} matches predicted`,
        action: { label: "Predict now →", to: "predict" }
      };
    }
  }

  return (
    <div>
      {/* ---- HERO ---- */}
      <div className="page-head">
        <div className="eyebrow">PANENKA · {hero.eyebrow}</div>
        <h1 className="page-title">{hero.l1}<br/><span className="it">{hero.l2}</span></h1>
        <p className="page-sub">
          {state.phase === "setup"
            ? "9 days to kickoff. Admin's setting the table — once the draw teams are in, predictions open and the league goes live."
            : state.phase === "done"
            ? "Tournament concluded. The standings are final. Check the leaderboard to see who took the crown."
            : `Currently running: ${PHASE_LABELS[state.phase]}. Lock in your picks before the round starts — once admin locks the phase, no changes allowed.`}
        </p>
      </div>

      {/* ---- COUNTDOWN ---- */}
      {!kickoffPassed ? (
        <div className="countdown-row">
          <div>
            <div className="countdown-label">KICKOFF IN</div>
            <div className="countdown-where">Mexico City · Jun 11 · WC2026 opens</div>
          </div>
          <div className="countdown-numbers">
            <div className="cd-unit"><div className="cd-val">{pad(days)}</div><div className="cd-label">DAYS</div></div>
            <div className="cd-sep">:</div>
            <div className="cd-unit"><div className="cd-val">{pad(hours)}</div><div className="cd-label">HRS</div></div>
            <div className="cd-sep">:</div>
            <div className="cd-unit"><div className="cd-val">{pad(minutes)}</div><div className="cd-label">MIN</div></div>
            <div className="cd-sep">:</div>
            <div className="cd-unit"><div className="cd-val">{pad(seconds)}</div><div className="cd-label">SEC</div></div>
          </div>
        </div>
      ) : (
        <div className="countdown-row live">
          <div>
            <div className="countdown-label">🔴 TOURNAMENT LIVE</div>
            <div className="countdown-where">WC2026 in progress · {PHASE_LABELS[state.phase]}</div>
          </div>
          <div className="countdown-numbers">
            <div className="cd-unit"><div className="cd-val" style={{ color: 'var(--green)'}}>GO</div><div className="cd-label">FOOTBALL</div></div>
          </div>
        </div>
      )}

      {/* ---- PHASE TIMELINE ---- */}
      <div className="phase-timeline">
        {phaseOrder.map((p, i) => (
          <React.Fragment key={p}>
            <div className={"phase-node" + (i < currentPhaseIdx ? " done" : i === currentPhaseIdx ? " current" : "")}>
              <div className="phase-dot"></div>
              <div className="phase-name">{PHASE_LABELS[p].replace("Quarter-finals","QF").replace("Semi-finals","SF").replace("Tournament Over","Done")}</div>
            </div>
            {i < phaseOrder.length - 1 && <div className={"phase-line" + (i < currentPhaseIdx ? " done" : "")}></div>}
          </React.Fragment>
        ))}
      </div>

      {/* ---- CTA ---- */}
      {cta && (
        <div className="cta-card">
          <div>
            <div className="cta-eyebrow">{cta.eyebrow}</div>
            <div className="cta-title">{cta.title}</div>
            <div className="cta-sub">{cta.sub}</div>
          </div>
          {cta.action && (
            <button className="btn btn-primary" onClick={() => setView(cta.action.to)}>{cta.action.label}</button>
          )}
        </div>
      )}

      {/* ---- STATS ROW ---- */}
      <div className="stat-row">
        <div className="stat">
          <div className="stat-label">Your Points</div>
          <div className="stat-value accent">{score.total}</div>

        <div className="stat">

          <div className="stat-value" style={{ fontSize: 22 }}>{state.locks[state.phase] ? "LOCKED" : "OPEN"}</div>

          {allScores.length === 0 ? (
            <div className="empty-mini">No players have predictions yet</div>
          ) : (
            <div className="podium">
              {allScores.slice(0, 5).map((s, i) => (
                <div key={s.name} className="podium-row">
                  <div className={"podium-rank" + (i === 0 ? " gold" : i === 1 ? " silver" : i === 2 ? " bronze" : "")}>{i+1}</div>
                  <div className="podium-name">{s.name}{s.name === user ? " · you" : ""}</div>
                  <div className="podium-pts">{s.total}</div>
                </div>
              ))}
            </div>
          )}
        </div>

        <div className="card">
          <div className="card-title">
            Your Breakdown
            <button className="btn btn-ghost btn-sm" onClick={onRefresh}>↻ Refresh</button>
          </div>
          <ul className="rules-list">
            <li><span className="rule-name">Group stage</span><span className="rule-points">{score.breakdown.group||0}</span></li>

            <li><span className="rule-name">Round of 16</span><span className="rule-points">{score.breakdown.r16||0}</span></li>
            <li><span className="rule-name">Quarter-finals</span><span className="rule-points">{score.breakdown.qf||0}</span></li>

      <div style={{ height: 18 }}></div>

      {/* ---- SCORING + ABOUT ---- */}
      <div className="grid grid-2">

          </p>
          <p style={{ color: 'var(--ink-dim)', fontSize: 14, lineHeight: 1.65, marginTop: 12 }}>

      {/* ---- HOW IT RUNS ---- */}
      <div className="card">
        <div className="card-title">How the league runs</div>

          <p style={{ marginBottom: 10 }}>
            <strong style={{ color: 'var(--ink)'}}>1 · Setup:</strong> Admin sets up the 12 group draw teams and opens predictions.
          </p>

            <strong style={{ color: 'var(--ink)'}}>2 · Group stage:</strong> Pick 12 group winners + 8 advancing third-placed teams. {state.scoring.groupWinner} point each.

            <strong style={{ color: 'var(--ink)'}}>3 · Knockouts unlock progressively:</strong> R32 ({state.scoring.r32}pts) → R16/QF/SF/F ({state.scoring.r16}pts winner + {state.scoring.r16Score}pts exact score).
          </p>
          <p>
            <strong style={{ color: 'var(--ink)'}}>4 · Bonus Qs throughout:</strong> Player of tournament, dark horses, top scorer — {state.scoring.bonus} points each.
          </p>
        </div>
      </div>
    </div>
  );
}

function PredictView({ state, myPred, updateMyPredictions, showToast }) {
  if (!myPred) return <div className="empty"><div className="empty-title">Loading…</div></div>;
  const phase = state.phase;

  if (phase === "setup") {
    return (
      <div>
        <div className="page-head">
          <div className="eyebrow">Pre-tournament</div>
          <h1 className="page-title">SETUP <span className="it">pending</span></h1>
          <p className="page-sub">Admin is still adding the group draw teams. Once setup is done and group stage opens, you can start predicting.</p>
        </div>
        <div className="empty">
          <div className="empty-title">NO PREDICTIONS YET</div>
          <p>Check back after admin sets up the groups and opens the predictions.</p>
        </div>
      </div>
    );
  }

  if (phase === "group") {
    return <GroupPredictView state={state} myPred={myPred} updateMyPredictions={updateMyPredictions} showToast={showToast} />;
  }

  return <KnockoutPredictView state={state} myPred={myPred} updateMyPredictions={updateMyPredictions} showToast={showToast} round={phase} />;
}

function GroupPredictView({ state, myPred, updateMyPredictions, showToast }) {
  const locked = state.locks.group;
  const groups = state.groups || {};
  const winners = myPred.groupWinners || {};
  const thirds = myPred.thirds || [];
  const allTeams = getAllTeams(state);
  const actualWinners = state.results.groupWinners || {};
  const actualThirds = state.results.thirdsAdvancing || [];
  const hasResults = Object.keys(actualWinners).length > 0;

  const setWinner = (L, team) => {
    if (locked) { showToast("Group predictions locked"); return; }
    updateMyPredictions(p => ({ ...p, groupWinners: { ...p.groupWinners, [L]: team } }));
  };

  const toggleThird = (team) => {
    if (locked) { showToast("Group predictions locked"); return; }
    updateMyPredictions(p => {
      const cur = p.thirds || [];
      if (cur.includes(team)) {
        return { ...p, thirds: cur.filter(t => t !== team) };
      } else {
        if (cur.length >= 8) { showToast("Max 8 third-placed teams"); return p; }
        return { ...p, thirds: [...cur, team] };
      }
    });
  };

  return (
    <div>
      <div className="page-head">
        <div className="eyebrow">PHASE 1 · GROUP STAGE</div>
        <h1 className="page-title">PICK 12 <span className="it">winners</span><br/>+ 8 <span className="it">thirds</span></h1>
        <p className="page-sub">
          Choose who tops each group, then mark the 8 best third-placed teams you think will advance to the Round of 32. 1 point per correct call.
        </p>
      </div>

      {locked && (
        <div className="lock-banner">
          🔒 Group stage predictions are locked. Showing your locked picks{hasResults ? " vs actual results" : ""}.
        </div>
      )}

      <h3 style={{ fontFamily: 'Anton', fontSize: 24, letterSpacing: '0.04em', marginBottom: 16, color: 'var(--accent-2)' }}>
        Group Winners <span style={{ fontFamily: 'JetBrains Mono', fontSize: 12, color: 'var(--ink-mute)', letterSpacing: '0.15em' }}>· {Object.values(winners).filter(Boolean).length}/12 picked</span>
      </h3>

      <div className="grid grid-3" style={{ marginBottom: 40 }}>
        {GROUP_LETTERS.map(L => {
          const teams = groups[L] || ["","","",""];
          const setupDone = teams.every(t => t && t.trim());
          const pick = winners[L];
          const actual = actualWinners[L];
          return (
            <div key={L} className="card group-card">
              <div className="group-head">
                <span className="group-letter">GROUP {L}</span>
                <span className="group-tag">
                  {!setupDone ? "TBD" : actual ? `WINNER · ${actual.toUpperCase()}` : "PICK 1"}
                </span>
              </div>
              {teams.map((t, i) => {
                if (!t || !t.trim()) {
                  return <div key={i} className="team-row faded"><span className="team-radio"></span><span className="team-name">— TBD —</span></div>;
                }
                const isChecked = pick === t;
                let cls = "team-radio";
                if (isChecked) cls += " checked";
                if (actual && isChecked) cls += pick === actual ? " correct" : " wrong";
                return (
                  <div key={i} className={"team-row" + (locked ? " locked" : "")} onClick={() => setWinner(L, t)}>
                    <span className={cls}></span>
                    <span className="team-name">{t}</span>
                    {actual === t && <span style={{ fontSize: 10, color: 'var(--green)', fontFamily: 'JetBrains Mono', letterSpacing: '0.1em' }}>WINNER</span>}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>

      <h3 style={{ fontFamily: 'Anton', fontSize: 24, letterSpacing: '0.04em', marginBottom: 16, color: 'var(--accent-2)' }}>
        Best Third-Placed Teams <span style={{ fontFamily: 'JetBrains Mono', fontSize: 12, color: 'var(--ink-mute)', letterSpacing: '0.15em' }}>· {thirds.length}/8 picked</span>
      </h3>
      <p className="helper" style={{ marginBottom: 16 }}>
        In the 2026 format with 12 groups of 4, the top 2 from each group plus the 8 best third-placed teams qualify for the Round of 32. Pick 8 teams you think will sneak through as the best 3rd-placers.
      </p>

      {allTeams.length === 0 ? (
        <div className="empty"><div className="empty-title">No teams yet</div><p>Admin needs to fill in the group draw first.</p></div>
      ) : (
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
          {allTeams.map(t => {
            const picked = thirds.includes(t);
            const isActual = actualThirds.includes(t);
            let cls = "team-pick";
            if (picked) cls += " selected";
            if (hasResults && picked && isActual) cls = "team-pick correct-pick";
            if (hasResults && picked && !isActual) cls = "team-pick wrong-pick";
            return (
              <div key={t} className={cls} style={{ minWidth: 130, cursor: locked ? 'not-allowed' : 'pointer' }} onClick={() => toggleThird(t)}>
                {t}
                {hasResults && isActual && !picked && <div style={{ fontSize: 9, marginTop: 4, color: 'var(--green)', fontFamily: 'JetBrains Mono', letterSpacing: '0.1em' }}>ACTUAL</div>}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function KnockoutPredictView({ state, myPred, updateMyPredictions, showToast, round }) {
  const locked = state.locks[round];
  const fixtures = (state.fixtures[round] || []);
  const userPicks = myPred[round] || {};
  const actuals = state.results[round] || {};
  const wantScore = round !== "r32";

  const setWinner = (mid, team) => {
    if (locked) { showToast("Predictions locked"); return; }
    updateMyPredictions(p => ({
      ...p,
      [round]: { ...p[round], [mid]: { ...(p[round]||{})[mid], winner: team } }
    }));
  };
  const setScore = (mid, score) => {
    if (locked) { showToast("Predictions locked"); return; }
    updateMyPredictions(p => ({
      ...p,
      [round]: { ...p[round], [mid]: { ...(p[round]||{})[mid], score } }
    }));
  };

  return (
    <div>
      <div className="page-head">
        <div className="eyebrow">PHASE · {PHASE_LABELS[round].toUpperCase()}</div>
        <h1 className="page-title">{round === "r32" ? "ROUND OF 32" : round === "r16" ? "ROUND OF 16" : round === "qf" ? "QUARTER FINALS" : round === "sf" ? "SEMIS" : "THE FINAL"}<br/><span className="it">predict.</span></h1>
        <p className="page-sub">
          {wantScore
            ? `Pick the winner and the exact score for every match. ${state.scoring[round]} pts winner + ${state.scoring[round+"Score"]} pts exact score.`
            : `Pick the winner of each fixture. ${state.scoring.r32} pts per correct call.`}
        </p>
      </div>

      {locked && (
        <div className="lock-banner">
          🔒 {PHASE_LABELS[round]} predictions are locked.
        </div>
      )}

      {fixtures.length === 0 ? (
        <div className="empty"><div className="empty-title">FIXTURES PENDING</div><p>Admin hasn't added the {PHASE_LABELS[round]} fixtures yet.</p></div>
      ) : (
        <div className="grid grid-2">
          {fixtures.map((f, idx) => {
            const u = userPicks[f.id] || {};
            const a = actuals[f.id] || {};
            const hasResult = !!a.winner;
            const winnerCorrect = hasResult && u.winner === a.winner;
            const scoreCorrect = hasResult && a.score && u.score === a.score;
            const score = u.score || "";
            const [s1, s2] = score.split("-");
            return (
              <div key={f.id} className="match-card">
                <div className="match-num">{f.label || `MATCH ${f.num || idx+1}`} · {f.venue ? f.venue.toUpperCase() : PHASE_LABELS[round].toUpperCase()}{f.date ? ` · ${f.date.toUpperCase()}` : ""}</div>
                <div className="match-teams">
                  {[f.team1, f.team2].map(t => {
                    let cls = "team-pick";
                    if (u.winner === t) cls += " selected";
                    if (hasResult && u.winner === t && winnerCorrect) cls = "team-pick correct-pick";
                    if (hasResult && u.winner === t && !winnerCorrect) cls = "team-pick wrong-pick";
                    if (hasResult && a.winner === t && u.winner !== t) cls += " actual-winner";
                    return (
                      <div key={t} className={cls} onClick={() => setWinner(f.id, t)} style={{ cursor: locked ? 'not-allowed' : 'pointer' }}>
                        {t}
                        {hasResult && a.winner === t && <div style={{ fontSize: 9, marginTop: 4, color: 'var(--green)', fontFamily: 'JetBrains Mono', letterSpacing: '0.1em' }}>WON</div>}
                      </div>
                    );
                  })}
                </div>
                {wantScore && (
                  <div className="score-row">
                    <input
                      type="number"
                      min="0"
                      max="20"
                      value={s1 || ""}
                      disabled={locked}
                      onChange={e => {
                        const v = e.target.value.replace(/[^0-9]/g, "");
                        const cur = (u.score || "").split("-");
                        setScore(f.id, `${v}-${cur[1]||""}`);
                      }}
                      placeholder="0"
                    />
                    <span className="score-dash">–</span>
                    <input
                      type="number"
                      min="0"
                      max="20"
                      value={s2 || ""}
                      disabled={locked}
                      onChange={e => {
                        const v = e.target.value.replace(/[^0-9]/g, "");
                        const cur = (u.score || "").split("-");
                        setScore(f.id, `${cur[0]||""}-${v}`);
                      }}
                      placeholder="0"
                    />
                  </div>
                )}
                {hasResult && (
                  <div className="match-result-strip">
                    <span>ACTUAL · {a.winner}{a.score ? ` (${a.score})` : ""}</span>
                    <span className="pts-badge">
                      +{(winnerCorrect ? state.scoring[round] : 0) + (wantScore && scoreCorrect ? state.scoring[round+"Score"] : 0)} pts
                    </span>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// BONUS VIEW
// ============================================================
function BonusView({ state, myPred, updateMyPredictions, showToast }) {
  if (!myPred) return null;
  const questions = state.bonus || [];
  const myAnswers = myPred.bonus || {};

  const setAnswer = (qid, val, locked) => {
    if (locked) { showToast("Question locked"); return; }
    updateMyPredictions(p => ({ ...p, bonus: { ...(p.bonus || {}), [qid]: val } }));
  };

  return (
    <div>
      <div className="page-head">
        <div className="eyebrow">{state.scoring.bonus} POINTS · EACH</div>
        <h1 className="page-title">BONUS<br/><span className="it">questions.</span></h1>
        <p className="page-sub">Player of the tournament, dark horses, biggest surprise — answer the random questions admin throws in. Worth {state.scoring.bonus} points each.</p>
      </div>

      {questions.length === 0 ? (
        <div className="empty">
          <div className="empty-title">NO BONUS QUESTIONS YET</div>
          <p>Admin hasn't added any bonus questions. Check back later.</p>
        </div>
      ) : (
        <div>
          {questions.map(q => {
            const myAns = myAnswers[q.id] || "";
            const locked = q.locked;
            const hasAnswer = !!q.answer;
            return (
              <div key={q.id} className="card bonus-card">
                <div className="bonus-q">{q.q}</div>
                {q.type === "select" && q.options && q.options.length > 0 ? (
                  <div className="bonus-opts">
                    {q.options.map(o => {
                      let cls = "bonus-opt";
                      if (myAns === o) cls += " selected";
                      if (hasAnswer && myAns === o && o === q.answer) cls = "bonus-opt correct";
                      if (hasAnswer && myAns === o && o !== q.answer) cls = "bonus-opt wrong";
                      return (
                        <div key={o} className={cls} onClick={() => setAnswer(q.id, o, locked)} style={{ cursor: locked ? 'not-allowed' : 'pointer' }}>
                          {o}
                          {hasAnswer && o === q.answer && myAns !== o && <div style={{ fontSize: 9, marginTop: 4, color: 'var(--green)', fontFamily: 'JetBrains Mono', letterSpacing: '0.1em' }}>ANSWER</div>}
                        </div>
                      );
                    })}
                  </div>
                ) : (
                  <input
                    type="text"
                    className="bonus-text-in"
                    value={myAns}
                    placeholder="Type your answer…"
                    disabled={locked}
                    onChange={e => setAnswer(q.id, e.target.value, locked)}
                  />
                )}
                <div style={{ marginTop: 14, display: 'flex', justifyContent: 'space-between', fontSize: 11, fontFamily: 'JetBrains Mono', letterSpacing: '0.1em', color: 'var(--ink-mute)' }}>
                  <span>{(q.points || state.scoring.bonus)} PTS · {locked ? "🔒 LOCKED" : "OPEN"}</span>
                  {hasAnswer && <span style={{ color: 'var(--green)' }}>ANSWER: {q.answer}</span>}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function LeaderboardView({ state, users, currentUser }) {
  const ranked = useMemo(() => {
    return users.map(u => ({ name: u.name, ...calculateScore(u, state) }))
                .sort((a,b) => b.total - a.total);
  }, [users, state]);

  return (
    <div>
      <div className="page-head">
        <div className="eyebrow">LIVE STANDINGS</div>
        <h1 className="page-title">THE <span className="it">leaderboard</span></h1>
      </div>

      {ranked.length === 0 ? (
        <div className="empty"><div className="empty-title">NO PLAYERS YET</div><p>Once friends sign in and make predictions, they'll show here.</p></div>
      ) : (
        <div className="card" style={{ padding: 0, overflowX: 'auto' }}>
          <table className="lb-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Player</th>
                <th>Breakdown</th>
                <th style={{ textAlign: 'right' }}>Total</th>
              </tr>
            </thead>
            <tbody>
              {ranked.map((r, i) => {
                let rankCls = "lb-rank";
                if (i === 0) rankCls += " gold";
                else if (i === 1) rankCls += " silver";
                else if (i === 2) rankCls += " bronze";
                return (
                  <tr key={r.name} style={{ background: r.name === currentUser ? 'var(--card-2)' : 'transparent' }}>
                    <td><div className={rankCls}>{i+1}</div></td>
                    <td>
                      <div style={{ fontWeight: 600, fontSize: 15 }}>{r.name}{r.name === currentUser ? " (you)" : ""}</div>
                    </td>
                    <td>
                      <div className="lb-breakdown">
                        <span>GRP <strong>{r.breakdown.group||0}</strong></span>
                        <span>R32 <strong>{r.breakdown.r32||0}</strong></span>
                        <span>R16 <strong>{r.breakdown.r16||0}</strong></span>
                        <span>QF <strong>{r.breakdown.qf||0}</strong></span>
                        <span>SF <strong>{r.breakdown.sf||0}</strong></span>
                        <span>FIN <strong>{r.breakdown.final||0}</strong></span>
                        <span>BONUS <strong>{r.breakdown.bonus||0}</strong></span>
                      </div>
                    </td>
                    <td className="lb-total">{r.total}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}
