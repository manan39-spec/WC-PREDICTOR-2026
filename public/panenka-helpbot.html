<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PANENKA · Ask the Ref</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15140f;
    --bg2:#1d1b15;
    --card:#23211a;
    --card2:#2b291f;
    --line:#3a3729;
    --ink:#f3eee2;
    --ink-dim:#c9c2ad;
    --ink-mute:#8c856f;
    --accent:#ed7d2b;
    --accent2:#f5b82e;
    --green:#7bbf5a;
    --user:#2f3a2a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(900px 500px at 100% -10%, rgba(237,125,43,.10), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(245,184,46,.07), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'DM Sans',sans-serif;
    display:flex; flex-direction:column;
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    width:100%; max-width:680px; margin:0 auto; flex:1;
    display:flex; flex-direction:column; min-height:100vh;
    border-left:1px solid var(--line); border-right:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,.012), transparent 200px);
  }
  /* header */
  header{
    padding:18px 20px 16px; border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:5;
    background:rgba(21,20,15,.86); backdrop-filter:blur(10px);
  }
  .brand{display:flex; align-items:center; gap:12px}
  .ball{
    width:40px;height:40px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 35% 30%, #fff 0 18%, var(--accent2) 19% 46%, var(--accent) 47% 100%);
    box-shadow:0 0 0 2px var(--bg), 0 0 24px rgba(237,125,43,.4);
    display:grid;place-items:center;
    font-family:'Anton';font-size:18px;color:#2a1a06;transform:rotate(-8deg);
  }
  .title h1{font-family:'Anton';font-size:26px;letter-spacing:.04em;line-height:.95}
  .title .sub{font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.18em;color:var(--accent2);text-transform:uppercase;margin-top:3px}
  .tag{font-size:12.5px;color:var(--ink-mute);margin-top:10px;line-height:1.45}
  /* chat */
  .chat{flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px}
  .msg{display:flex; gap:10px; align-items:flex-end; animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg.user{flex-direction:row-reverse}
  .av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:'Anton';font-size:13px}
  .av.bot{background:linear-gradient(145deg,var(--accent),var(--accent2));color:#2a1a06}
  .av.user{background:var(--user);color:var(--green);border:1px solid var(--line)}
  .bubble{
    max-width:80%; padding:12px 15px; border-radius:16px; font-size:14.5px; line-height:1.5;
    border:1px solid var(--line);
  }
  .msg.bot .bubble{background:var(--card); border-bottom-left-radius:4px}
  .msg.user .bubble{background:var(--user); border-bottom-right-radius:4px; color:#eef4ea}
  .bubble strong{color:var(--accent2); font-weight:700}
  .bubble .money{color:var(--green); font-weight:700}
  .bubble ul{margin:7px 0 2px; padding-left:18px}
  .bubble li{margin:3px 0}
  .bubble .pts{font-family:'JetBrains Mono';font-size:12.5px;color:var(--accent)}
  .bubble em{color:var(--ink-dim);font-style:italic}
  /* chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 6px}
  .chip{
    font-family:'DM Sans';font-size:12.5px;font-weight:500;
    background:var(--card2);color:var(--ink-dim);border:1px solid var(--line);
    padding:7px 12px;border-radius:20px;cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .chip:hover{border-color:var(--accent);color:var(--ink);transform:translateY(-1px)}
  .chips-label{font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:.16em;color:var(--ink-mute);
    text-transform:uppercase;padding:4px 20px 2px;width:100%}
  /* input */
  .composer{
    border-top:1px solid var(--line); padding:14px 16px 18px;
    background:rgba(21,20,15,.9); backdrop-filter:blur(8px); position:sticky; bottom:0;
  }
  .field{display:flex;gap:10px;align-items:center}
  input[type=text]{
    flex:1; background:var(--bg2); border:1px solid var(--line); border-radius:24px;
    padding:13px 17px; color:var(--ink); font-family:'DM Sans'; font-size:15px; outline:none; transition:.15s;
  }
  input[type=text]:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(237,125,43,.13)}
  input::placeholder{color:var(--ink-mute)}
  .send{
    width:46px;height:46px;border:none;border-radius:50%;flex:none;cursor:pointer;
    background:linear-gradient(145deg,var(--accent),var(--accent2)); color:#2a1a06;
    font-size:19px;display:grid;place-items:center;transition:.15s;
  }
  .send:hover{transform:scale(1.06)}
  .send:active{transform:scale(.95)}
  .foot{text-align:center;font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:.1em;color:var(--ink-mute);margin-top:10px}
  .foot a{color:var(--accent2);text-decoration:none}
  /* typing */
  .typing{display:flex;gap:4px;padding:4px 2px}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--ink-mute);animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  ::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="ball">P</div>
      <div class="title">
        <h1>ASK THE REF</h1>
        <div class="sub">PANENKA · WC 2026 Helpdesk</div>
      </div>
    </div>
    <div class="tag">Got a question about the league? Ask away — rules, deadlines, points, dark horses, prizes, whatever. Type it however you like.</div>
  </header>

  <div class="chat" id="chat"></div>

  <div id="chipsBox">
    <div class="chips-label">Popular questions</div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="composer">
    <div class="field">
      <input type="text" id="input" placeholder="Ask anything… e.g. how do dark horses work?" autocomplete="off">
      <button class="send" id="send" aria-label="Send">➤</button>
    </div>
    <div class="foot">Not sure? Message <a href="#">Manan</a> directly · PANENKA™</div>
  </div>
</div>

<script>
// ============ KNOWLEDGE BASE ============
// Each entry: triggers (keywords/phrases) + answer (HTML). Matching scores by trigger hits.
const KB = [
  {
    id:"join",
    chip:"How do I join?",
    triggers:["join","sign up","signup","register","get in","how do i play","how to play","create account","make account","log in first time","new account","getting started","start playing"],
    a:`Easy. Go to the league link, type in a <strong>username</strong> (use your real name or a unique nickname), set a <strong>password</strong>, and you're in. Use that same login every time so all your picks stay tied to you. That's the whole onboarding. 🎉`
  },
  {
    id:"login",
    chip:"I can't log in",
    triggers:["can't log in","cant login","login not working","cannot sign in","wont let me in","won't log in","login issue","trouble logging","stuck on login","name taken","username taken","says password"],

      <li>Make sure you're typing your <strong>username exactly</strong> the way you set it up (it's case-sensitive).</li>
      <li>If it's asking for a password you don't recognise, someone may already be using that name — try a more unique one.</li>

  {

    chip:"The site is laggy",

  },
  {
    id:"deadline",
    chip:"When's the deadline?",
    triggers:["deadline","when due","last date","cut off","cutoff","when lock","when do picks lock","submit by","when does it start","when start","kick off","kickoff","last day","time limit","when close"],
    a:`All your <strong>group-stage picks</strong> must be locked in <strong>before the opening whistle on 11 June</strong>. Miss it and you're watching from the bench. Knockout-round picks lock individually before each round kicks off.`
  },
  {
    id:"entry",
    chip:"How much to enter?",
    triggers:["entry","cost","fee","how much","price","pay","payment","20","money to join","buy in","buyin"],
    a:`<span class="money">$20 per person.</span> Pay before you pick — no pay, no play. And yes, there's real money on the line. 💸`
  },
  {
    id:"prizes",
    chip:"What can I win?",
    triggers:["prize","win money","payout","how much win","reward","what do i get","winnings","pot","prize money","what's the prize","whats the prize","cash","how much can i win","much money","money can i win","much do i win"],
    a:`The pot is split two ways — <strong>two separate paths to cash</strong>:<ul>
      <li><strong>Main leaderboard (85%):</strong> <span class="money">1st = 60%</span>, <span class="money">2nd = 30%</span>, <span class="money">3rd = 10%</span></li>
      <li><strong>Best Dark Horse Run (15%):</strong> goes to whoever racks up the most dark-horse points — <em>even if you don't finish top 3.</em></li></ul>

  },
  {
    id:"both",
    chip:"Can I win two prizes?",
    triggers:["win both","two prizes","multiple prizes","both prizes","win twice","dark horse and first","can i win both"],
    a:`Yep — the <strong>main leaderboard</strong> and the <strong>Best Dark Horse Run</strong> are separate prizes. If you top the table AND have the best underdog picks, you take home both. 💰💰`
  },
  {

    a:`If two players finish level on total points, the one with the <strong>most correct exact scorelines predicted</strong> wins the tiebreaker. Precision pays. ⚖️`
  },
  {
    id:"scoring",
    chip:"How does scoring work?",
    triggers:["scoring","points work","how points","point system","how do points","points system","how scoring","earn points","how do i score"],
    a:`Points get <strong>bigger the deeper the tournament goes</strong>:<ul>
      <li>Group winners — <span class="pts">1 pt</span> each (12 groups)</li>
      <li>Best 8 third-placed teams — <span class="pts">1 pt</span> each</li>
      <li>Round of 32 winner — <span class="pts">2 pts</span></li>

      <li>Quarter-final winner — <span class="pts">5 (+3 exact)</span></li>
      <li>Semi-final winner — <span class="pts">7 (+3 exact)</span></li>
      <li>🏆 Final winner — <span class="pts">10 (+5 exact)</span></li>
      <li>🥉 3rd-place playoff — <span class="pts">8 (+3 exact)</span></li></ul>
      Plus bonus questions and dark horses on top. The final stretch is where leagues are won — don't switch off early.`
  },
  {
    id:"exact",
    chip:"What's an exact score?",
    triggers:["exact score","scoreline","correct score","score prediction","predict score","exact result","what is exact score","bonus for score"],
    a:`From the Round of 16 onwards, you can predict the <strong>exact scoreline</strong>, not just the winner. So instead of just "Spain wins", you'd say "Spain 2–1". Nail it and you bank <strong>bonus points on top</strong> of the winner points (e.g. +3 in the R16/QF/SF, +5 in the Final). It's also the <strong>tiebreaker</strong>, so it really matters.`
  },

    id:"groupwin",

    a:`There are <strong>12 groups</strong>. For each one, you predict which team finishes <strong>1st</strong>. Every correct group winner = <span class="pts">1 point</span>. Simple group-stage reading — but 12 easy points are 12 easy points. 🎯`
  },
  {
    id:"thirds",
    chip:"The 8 third-placed teams?",
    triggers:["third placed","3rd place teams","best thirds","8 thirds","third place","best 8","thirds advancing","which thirds","third placed teams","8 best"],
    a:`Every group has a team that finishes <strong>3rd</strong> — that's 12 possible third-placed teams. But only the <strong>8 strongest thirds advance</strong> to the Round of 32; the other 4 go home.<br><br>
      <strong>Your job:</strong> pick which 8 of those 12 you think will be strong enough to qualify. Each correct one = <span class="pts">1 point</span> (max 8). It's a sneaky category — most people ignore it, so it's free points if you read the groups well.`
  },
  {
    id:"dh",
    chip:"How do dark horses work?",
    triggers:["dark horse","dark horses","underdog","underdogs","horses","dh","spicy","what are dark horses","dark horse work"],
    a:`The spicy bit. 🐎 You pick <strong>7 underdog teams</strong> spread across regions:<ul>
      <li><strong>2</strong> from South America / CONCACAF</li>
      <li><strong>3</strong> from Europe / Asia</li>
      <li><strong>2</strong> from Africa</li></ul>
      You <em>can't</em> pick the obvious giants (no Spain, France, England, Brazil, Argentina, Portugal).<br><br>
      Each horse earns points <strong>every round it advances</strong> (cumulative), AND the <strong>fewer friends who picked it, the bigger your bonus</strong>. Spot a deep run before everyone else = jackpot. Ask me about "<em>dark horse points</em>" or the "<em>popularity bonus</em>" for the full maths.`
  },
  {
    id:"dhregions",
    chip:"Dark horse regions / how many?",
    triggers:["how many dark horse","dark horse regions","region","how many horses","how many underdog","how many do i pick","how many teams do i pick","7 teams","which regions","region rule","continent","saconc","euasia","africa quota"],
    a:`You pick <strong>7 dark horses total</strong>, split by region so you can't just stack one continent:<ul>
      <li><strong>2</strong> — South America / CONCACAF (e.g. Uruguay, Ecuador, Mexico, Colombia)</li>
      <li><strong>3</strong> — Europe / Asia (e.g. Croatia, Netherlands, Austria, Japan)</li>
      <li><strong>2</strong> — Africa (e.g. Morocco, Senegal, Ivory Coast, Ghana)</li></ul>`
  },
  {
    id:"dhexclude",
    chip:"Which teams can't be dark horses?",
    triggers:["excluded","can't pick","cant pick dark horse","not allowed","banned teams","which teams excluded","big teams","favourites excluded","spain france brazil","pick brazil","pick spain","pick argentina","pick france","pick england","pick portugal","as a dark horse"],
    a:`The obvious heavyweights are off-limits as dark horses (too easy): <strong>Spain, France, England, Brazil, Argentina, Portugal</strong>. Everyone else is fair game. The whole point is spotting an <em>underdog</em>. 😉`
  },
  {
    id:"dhpoints",
    chip:"Dark horse points explained",
    triggers:["dark horse points","how many points dark horse","dh points","cumulative","dark horse scoring","points for dark horse","horse points"],
    a:`Each dark horse earns <strong>cumulatively</strong> the further it goes:<ul>
      <li>Reaches R32 = <span class="pts">1</span></li>
      <li>Reaches R16 = <span class="pts">+3 (total 4)</span></li>
      <li>Reaches QF = <span class="pts">+5 (total 9)</span></li>
      <li>Reaches SF = <span class="pts">+8 (total 17)</span></li>
      <li>Reaches Final = <span class="pts">+10 (total 27!)</span></li></ul>
      Then the <strong>popularity bonus</strong> stacks on top of that. Ask me about the popularity bonus for the juicy part. 🔥`
  },
  {
    id:"popularity",
    chip:"What's the popularity bonus?",
    triggers:["popularity","popular","bonus per round","less popular","unpopular","popularity bonus","percent picked","everyone picked","nobody picked"],
    a:`Once the Round of 16 locks, the app sees who picked which horses. The <strong>less popular your pick, the bigger the bonus per round it advances</strong>:<ul>
      <li>Picked by <strong>&lt;25%</strong> of the league → <span class="pts">+3 / round</span></li>
      <li><strong>25–50%</strong> → <span class="pts">+2 / round</span></li>
      <li><strong>50–75%</strong> → <span class="pts">+1 / round</span></li>
      <li><strong>75%+</strong> → <span class="pts">+0 / round</span></li></ul>
      <strong>Example:</strong> You back Morocco, only 25% of the league did, and they reach the QF (3 rounds). Base = 9, bonus = 3×3 = 9 → <span class="money">18 pts</span>. If <em>everyone</em> had picked Morocco, that bonus drops to 0 and you'd get just 9. Spot it first, win big. 🐎`
  },
  {
    id:"dhprize",

    a:`The <strong>Best Dark Horse Run</strong> prize (15% of the pot) goes to whoever <strong>accumulates the most dark-horse points</strong> across the whole tournament. You can win this <em>even if you finish nowhere near the top of the main table</em> — it's a completely separate prize. Pick brave, pick unpopular, win cash. 💰`

  {

    triggers:["change picks","edit picks","change my prediction","edit prediction","change after","update picks","change mind","resubmit","modify","can i edit","change dark horse"],
    a:`Depends what and when:<ul>

      <li><strong>Dark horses</strong> — you can adjust these right up until the <strong>Round of 16 locks</strong>, so you can react to early upsets.</li></ul>

  },

    id:"locks",
    chip:"When do picks lock?",
    triggers:["lock","when lock","picks lock","locked","freeze","when frozen","locking","round lock"],
    a:`Each stage <strong>freezes before it kicks off</strong>:<ul>
      <li>Group picks lock at the opening whistle — <strong>11 June</strong>.</li>
      <li>Every knockout round locks right before that round begins.</li>
      <li>Dark horses stay editable until the <strong>Round of 16</strong> locks.</li></ul>
      Once something's locked, it's set in stone — so choose wisely.`
  },
  {
    id:"bonus",
    chip:"What are the bonus questions?",
    triggers:["bonus question","bonus questions","golden boot","golden glove","player of tournament","pott","extra questions","side questions","bonus q"],
    a:`Side predictions like <strong>Golden Boot, Golden Glove, Player of the Tournament</strong> and more. We'll <strong>add new ones as the tournament progresses</strong>, and the points on offer will vary depending on the stage. Keep an eye out — they're easy points if you're paying attention. 🎲`
  },
  {
    id:"bronze",
    chip:"The 3rd-place playoff?",
    triggers:["bronze","third place playoff","3rd place playoff","bronze final","playoff","third place match","bronze match"],
    a:`The <strong>3rd-place playoff</strong> (the bronze final) is scored separately from the big final: <span class="pts">8 points</span> for the correct winner, plus <span class="pts">3 more</span> for the exact score. Don't sleep on it — it's worth nearly as much as the final. 🥉`
  },
  {
    id:"who",
    chip:"Who runs this?",
    triggers:["who runs","who is admin","who made this","organizer","commissioner","who is in charge","whose league","who manages","contact","who is running","running this","who runs this","whos running","who's running"],
    a:`This league is run by <strong>Manan</strong> — the admin and commissioner. Any issues with logins, payments, or rules disputes, he's your guy. 👑`
  },
  {
    id:"name",
    chip:"Why 'PANENKA'?",
    triggers:["why panenka","what is panenka","name mean","why called","meaning of panenka","panenka meaning","what does panenka"],
    a:`It's named after <strong>Antonín Panenka's</strong> iconic 1976 penalty — the cheekiest, most audacious spot-kick in history, chipped right down the middle while everyone expected power. The whole vibe of this league: <em>back your instincts and be bold.</em> ⚽`
  },

// greetings & thanks handled specially
const GREETING = `Hey! 👋 I'm the PANENKA helpdesk. Ask me anything about the league — how to join, the deadline, how points work, dark horses, prizes, all of it. Tap a question below or type your own.`;
const THANKS = `Anytime! Good luck with your picks — may the boldest predictor win. 🏆⚽`;
const FALLBACK = `Hmm, I'm not 100% sure I got that one. Try rephrasing, or tap one of the popular questions below 👇<br><br>If it's something specific (a payment, a login glitch, a rules edge-case), best to message <strong>Manan</strong> directly — he'll sort you out.`;

// ============ MATCHING ENGINE ============
function normalize(s){return s.toLowerCase().replace(/[^\w\s%]/g," ").replace(/\s+/g," ").trim();}
const GREET_WORDS=["hi","hello","hey","yo","sup","hiya","howdy","good morning","good evening","namaste","heya"];
const THANK_WORDS=["thanks","thank you","thx","cheers","ty","appreciate","nice one","great"];

function bestMatch(q){
  const n=normalize(q);
  if(!n) return null;
  // greeting / thanks
  if(GREET_WORDS.some(w=>n===w||n.startsWith(w+" ")) && n.split(" ").length<=3) return {type:"greet"};
  if(THANK_WORDS.some(w=>n.includes(w))) return {type:"thanks"};
  // score entries
  let best=null,bestScore=0;
  for(const e of KB){
    let score=0;
    for(const t of e.triggers){
      const tn=normalize(t);
      if(n.includes(tn)){
        // multi-word triggers weigh more; longer = more specific
        score += tn.includes(" ") ? 3 + tn.length*0.05 : 1.2;
      } else {
        // partial: count shared significant words
        const tw=tn.split(" ").filter(w=>w.length>3);
        const hit=tw.filter(w=>n.includes(w)).length;
        if(tw.length && hit) score += (hit/tw.length)*0.9;
      }
    }
    if(score>bestScore){bestScore=score;best=e;}
  }
  if(bestScore>=1.0) return {type:"answer",entry:best};
  return null;
}

// ============ UI ============
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const sendBtn=document.getElementById("send");
const chipsEl=document.getElementById("chips");

function addMsg(html,who){
  const m=document.createElement("div");
  m.className="msg "+who;
  m.innerHTML=`<div class="av ${who}">${who==="bot"?"P":"YOU"==="YOU"?"·":"·"}</div><div class="bubble">${html}</div>`;
  // fix avatar label
  m.querySelector(".av").textContent = who==="bot" ? "P" : "U";
  chat.appendChild(m);
  chat.scrollTop=chat.scrollHeight;
  return m;
}
function typing(){
  const m=document.createElement("div");
  m.className="msg bot";
  m.innerHTML=`<div class="av bot">P</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chat.appendChild(m); chat.scrollTop=chat.scrollHeight;
  return m;
}
function botReply(html){
  const t=typing();
  setTimeout(()=>{ t.remove(); addMsg(html,"bot"); }, 380+Math.random()*260);
}

function handle(q){
  if(!q.trim()) return;
  addMsg(q.replace(/</g,"&lt;"),"user");
  const r=bestMatch(q);
  if(!r) return botReply(FALLBACK);
  if(r.type==="greet") return botReply(GREETING);
  if(r.type==="thanks") return botReply(THANKS);
  if(r.type==="answer") return botReply(r.entry.a);
}

// build chips (a curated, varied subset)
const chipIds=["join","deadline","scoring","dh","prizes","thirds","popularity","edit","bonus","lag","tiebreak","password"];
chipIds.forEach(id=>{
  const e=KB.find(x=>x.id===id); if(!e)return;
  const c=document.createElement("button");
  c.className="chip"; c.textContent=e.chip;
  c.onclick=()=>{ handle(e.chip); };
  chipsEl.appendChild(c);
});

sendBtn.onclick=()=>{ const v=input.value; input.value=""; handle(v); };
input.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const v=input.value; input.value=""; handle(v); }});

// opening message
setTimeout(()=>addMsg(GREETING,"bot"),300);
</script>
